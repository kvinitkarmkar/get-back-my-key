<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090c">

<title>Password Recovery Tracker</title>

<style>
    :root {
        --bg: #08090c;
        --surface: #101114;
        --surface-2: #15161a;
        --border: #25262b;
        --border-hover: #33343a;

        --text: #f5f5f7;
        --muted: #92939b;
        --muted-2: #6e7078;

        --blue: #3b82f6;
        --green: #22c55e;
        --red: #ef4444;

        --radius-lg: 18px;
        --radius-md: 14px;
        --radius-sm: 10px;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(
                circle at 50% -10%,
                rgba(59, 130, 246, 0.08),
                transparent 32%
            ),
            var(--bg);
        color: var(--text);
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
    }

    button,
    input {
        font: inherit;
    }

    button {
        -webkit-user-select: none;
        user-select: none;
    }

    /* =========================
       APP
    ========================= */

    .app {
        width: min(100% - 32px, 760px);
        margin: 0 auto;
        padding: 48px 0 36px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #151619;
        border: 1px solid #292a2f;
        border-radius: 22px;

        box-shadow:
            0 12px 40px rgba(0, 0, 0, 0.35),
            inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .logo svg {
        width: 34px;
        height: 34px;
        color: #d8d9de;
    }

    .header h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 38px);
        line-height: 1.15;
        letter-spacing: -1.2px;
        font-weight: 750;
    }

    .header p {
        max-width: 560px;
        margin: 14px auto 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
    }

    /* =========================
       ADD BOX
    ========================= */

    .add-box {
        padding: 16px;
        margin-bottom: 20px;

        background: rgba(16, 17, 20, 0.88);
        border: 1px solid var(--border);
        border-radius: 20px;

        box-shadow:
            0 15px 40px rgba(0,0,0,0.18),
            inset 0 1px 0 rgba(255,255,255,0.02);
    }

    .input-wrap {
        position: relative;
    }

    .password-input {
        width: 100%;
        height: 58px;

        padding: 0 17px;

        background: #17181c;
        color: var(--text);

        border: 1px solid #292a2f;
        border-radius: 15px;

        outline: none;
        font-size: 17px;

        transition: border-color .2s, box-shadow .2s;
    }

    .password-input::placeholder {
        color: #686a73;
    }

    .password-input:focus {
        border-color: rgba(59,130,246,.65);
        box-shadow: 0 0 0 3px rgba(59,130,246,.10);
    }

    .add-button {
        width: 100%;
        height: 56px;
        margin-top: 10px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        background: var(--blue);
        color: white;

        border: 0;
        border-radius: 15px;

        font-size: 17px;
        font-weight: 700;

        cursor: pointer;

        transition:
            transform .15s,
            background .2s;
    }

    .add-button:hover {
        background: #3275df;
    }

    .add-button:active {
        transform: scale(.985);
    }

    .add-button svg {
        width: 22px;
        height: 22px;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 22px;
    }

    .stat {
        min-width: 0;
        padding: 16px 10px;

        background: #101114;
        border: 1px solid var(--border);
        border-radius: 17px;

        text-align: center;
    }

    .stat-value {
        display: block;
        font-size: 27px;
        line-height: 1;
        font-weight: 750;
    }

    .stat-label {
        display: block;
        margin-top: 8px;

        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .7px;
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-section {
        margin-bottom: 22px;
    }

    .progress-top {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 9px;

        color: var(--muted);
        font-size: 13px;
    }

    .progress-track {
        height: 7px;
        overflow: hidden;

        background: #202126;
        border-radius: 99px;
    }

    .progress-bar {
        height: 100%;
        width: 0%;

        background: var(--blue);
        border-radius: inherit;

        transition: width .3s ease;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
        position: relative;
        margin-bottom: 14px;
    }

    .search-box svg {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);

        width: 21px;
        height: 21px;

        color: #777983;
        pointer-events: none;
    }

    .search-input {
        width: 100%;
        height: 52px;

        padding: 0 16px 0 48px;

        background: #101114;
        color: var(--text);

        border: 1px solid var(--border);
        border-radius: 14px;

        outline: none;
        font-size: 15px;
    }

    .search-input:focus {
        border-color: #34363d;
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
        display: flex;
        gap: 7px;

        overflow-x: auto;
        padding-bottom: 3px;
        margin-bottom: 16px;

        scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
        display: none;
    }

    .filter-btn {
        flex: 0 0 auto;

        padding: 9px 16px;

        background: transparent;
        color: var(--muted);

        border: 1px solid transparent;
        border-radius: 99px;

        font-size: 14px;
        font-weight: 650;

        cursor: pointer;
    }

    .filter-btn.active {
        background: #191a1e;
        color: #f1f1f3;
        border-color: #292a2f;
    }

    /* =========================
       LIST
    ========================= */

    #list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* =========================
       PASSWORD CARD
    ========================= */

    .item {
        position: relative;

        padding: 14px 14px 13px 16px;

        background: #101114;
        border: 1px solid var(--border);
        border-left: 4px solid #414249;

        border-radius: 17px;

        transition:
            border-color .2s,
            transform .15s;
    }

    .item:hover {
        border-color: var(--border-hover);
    }

    .item.success {
        border-left-color: var(--green);
    }

    .item.failed {
        border-left-color: var(--red);
    }

    /* Top row */

    .item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;

        min-height: 36px;
    }

    .attempt-number {
        color: #70727b;
        font-size: 12px;
        font-weight: 700;
    }

    .actions {
        display: flex;
        gap: 5px;
    }

    .icon-btn {
        width: 38px;
        height: 38px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #17181c;
        color: #8f9199;

        border: 1px solid #292a2f;
        border-radius: 11px;

        cursor: pointer;

        transition:
            background .15s,
            color .15s,
            border-color .15s,
            transform .1s;
    }

    .icon-btn:hover {
        background: #1d1e22;
        color: #e4e5e8;
        border-color: #37383f;
    }

    .icon-btn:active {
        transform: scale(.94);
    }

    .icon-btn svg {
        width: 20px;
        height: 20px;
        stroke-width: 1.8;
    }

    .icon-btn.success-active {
        color: #86efac;
        border-color: rgba(34,197,94,.35);
        background: rgba(34,197,94,.09);
    }

    .icon-btn.failed-active {
        color: #fca5a5;
        border-color: rgba(239,68,68,.35);
        background: rgba(239,68,68,.09);
    }

    /* Password */

    .password-text {
        margin-top: 14px;

        color: #f1f1f3;

        font-family:
            "SFMono-Regular",
            Consolas,
            "Liberation Mono",
            Menlo,
            monospace;

        font-size: 17px;
        line-height: 1.45;

        word-break: break-word;
        overflow-wrap: anywhere;

        white-space: pre-wrap;
    }

    /* Status */

    .item-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-top: 12px;
    }

    .status {
        display: inline-flex;
        align-items: center;

        padding: 5px 11px;

        border-radius: 99px;

        background: #24252a;
        color: #a7a8af;

        font-size: 11px;
        font-weight: 750;
        letter-spacing: .4px;
    }

    .status.success {
        background: rgba(34,197,94,.12);
        color: #86efac;
    }

    .status.failed {
        background: rgba(239,68,68,.12);
        color: #fca5a5;
    }

    .date {
        color: #62646c;
        font-size: 11px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
        padding: 45px 20px;

        text-align: center;
        color: var(--muted-2);

        border: 1px dashed #292a2f;
        border-radius: 17px;
    }

    .empty svg {
        width: 32px;
        height: 32px;
        margin-bottom: 10px;
        color: #55575f;
    }

    .empty-title {
        color: #999ba3;
        font-size: 15px;
        font-weight: 650;
    }

    .empty-subtitle {
        margin-top: 5px;
        font-size: 13px;
    }

    /* =========================
       BACKUP
    ========================= */

    .backup {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;

        margin-top: 22px;
    }

    .backup-btn {
        height: 52px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;

        background: #151619;
        color: #d2d3d7;

        border: 1px solid #292a2f;
        border-radius: 14px;

        font-size: 14px;
        font-weight: 700;

        cursor: pointer;
    }

    .backup-btn:hover {
        background: #1b1c20;
    }

    .backup-btn svg {
        width: 20px;
        height: 20px;
    }

    .backup-btn input {
        display: none;
    }

    /* =========================
       LOCAL STORAGE NOTICE
    ========================= */

    .local-notice {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;

        margin-top: 24px;

        color: #62646c;
        font-size: 12px;
    }

    .local-dot {
        width: 7px;
        height: 7px;

        background: var(--green);
        border-radius: 50%;

        box-shadow: 0 0 8px rgba(34,197,94,.55);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;

        transform: translate(-50%, 20px);

        max-width: calc(100% - 32px);

        padding: 11px 15px;

        background: #1b1c20;
        color: #f0f0f2;

        border: 1px solid #303137;
        border-radius: 11px;

        box-shadow: 0 10px 30px rgba(0,0,0,.35);

        font-size: 13px;
        font-weight: 600;

        opacity: 0;
        pointer-events: none;

        transition:
            opacity .2s,
            transform .2s;

        z-index: 100;
        text-align: center;
    }

    .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    .toast.error {
        border-color: rgba(239,68,68,.35);
    }

    .toast.success {
        border-color: rgba(34,197,94,.35);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {
        .app {
            width: calc(100% - 24px);
            padding-top: 28px;
            padding-bottom: 28px;
        }

        .header {
            margin-bottom: 23px;
        }

        .logo {
            width: 62px;
            height: 62px;
            border-radius: 19px;
            margin-bottom: 18px;
        }

        .logo svg {
            width: 29px;
            height: 29px;
        }

        .header h1 {
            font-size: 28px;
            letter-spacing: -.8px;
        }

        .header p {
            margin-top: 10px;
            font-size: 14px;
        }

        .add-box {
            padding: 12px;
            border-radius: 17px;
        }

        .password-input {
            height: 54px;
            font-size: 16px;
        }

        .add-button {
            height: 54px;
        }

        .stats {
            gap: 8px;
        }

        .stat {
            padding: 14px 7px;
            border-radius: 15px;
        }

        .stat-value {
            font-size: 24px;
        }

        .stat-label {
            font-size: 10px;
        }

        .item {
            padding: 12px 11px 12px 13px;
            border-radius: 15px;
        }

        .icon-btn {
            width: 35px;
            height: 35px;
            border-radius: 10px;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .actions {
            gap: 4px;
        }

        .password-text {
            margin-top: 11px;
            font-size: 16px;
        }

        .item-bottom {
            margin-top: 10px;
        }

        .backup {
            gap: 8px;
        }

        .backup-btn {
            height: 48px;
            font-size: 13px;
        }
    }

    @media (max-width: 380px) {
        .app {
            width: calc(100% - 18px);
        }

        .header h1 {
            font-size: 25px;
        }

        .icon-btn {
            width: 33px;
            height: 33px;
        }

        .password-text {
            font-size: 15px;
        }

        .backup-btn {
            font-size: 12px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            <!-- Key icon -->
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <circle cx="8" cy="15" r="4"></circle>
                <path d="M11 12l9-9"></path>
                <path d="M17 5l2 2"></path>
                <path d="M15 7l2 2"></path>
            </svg>
        </div>

        <h1>Password Recovery Tracker</h1>

        <p>
            Keep track of password combinations you've tried.
            Copy, test, and mark each attempt.
        </p>

    </header>


    <!-- ADD -->
    <section class="add-box">

        <div class="input-wrap">
            <input
                id="pwInput"
                class="password-input"
                type="text"
                autocomplete="off"
                placeholder="Enter password combination..."
                aria-label="Password combination"
            >
        </div>

        <button
            id="addButton"
            class="add-button"
            type="button"
        >
            <!-- Plus icon -->
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round">
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </svg>

            Add
        </button>

    </section>


    <!-- STATS -->
    <section class="stats">

        <div class="stat">
            <span id="totalCount" class="stat-value">0</span>
            <span class="stat-label">TOTAL</span>
        </div>

        <div class="stat">
            <span id="triedCount" class="stat-value">0</span>
            <span class="stat-label">TRIED</span>
        </div>

        <div class="stat">
            <span id="successCount" class="stat-value">0</span>
            <span class="stat-label">SUCCESS</span>
        </div>

    </section>


    <!-- PROGRESS -->
    <section class="progress-section">

        <div class="progress-top">
            <span>Recovery progress</span>
            <span id="progressText">0%</span>
        </div>

        <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
        </div>

    </section>


    <!-- SEARCH -->
    <div class="search-box">

        <!-- Search icon -->
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
        </svg>

        <input
            id="searchInput"
            class="search-input"
            type="text"
            autocomplete="off"
            placeholder="Search attempts..."
        >

    </div>


    <!-- FILTERS -->
    <div class="filters">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="pending">
            Pending
        </button>

        <button class="filter-btn" data-filter="failed">
            Failed
        </button>

        <button class="filter-btn" data-filter="success">
            Success
        </button>

    </div>


    <!-- LIST -->
    <div id="list"></div>


    <!-- BACKUP -->
    <section class="backup">

        <button id="exportButton" class="backup-btn" type="button">

            <!-- Download icon -->
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M12 3v12"></path>
                <path d="M7 10l5 5 5-5"></path>
                <path d="M4 21h16"></path>
            </svg>

            Export Backup
        </button>


        <label class="backup-btn">

            <!-- Upload icon -->
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M12 16V4"></path>
                <path d="M7 9l5-5 5 5"></path>
                <path d="M4 20h16"></path>
            </svg>

            Import Backup

            <input
                id="importInput"
                type="file"
                accept=".json,application/json"
            >

        </label>

    </section>


    <!-- LOCAL STORAGE -->
    <div class="local-notice">
        <span class="local-dot"></span>
        <span>Saved locally in this browser</span>
    </div>

</div>


<!-- TOAST -->
<div id="toast" class="toast"></div>


<script>
"use strict";

/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY = "get_back_my_key_attempts_v1";


/* =========================================
   STATE
========================================= */

let passwords = [];
let currentFilter = "all";
let searchQuery = "";


/* =========================================
   DOM
========================================= */

const pwInput = document.getElementById("pwInput");
const addButton = document.getElementById("addButton");

const list = document.getElementById("list");

const totalCount = document.getElementById("totalCount");
const triedCount = document.getElementById("triedCount");
const successCount = document.getElementById("successCount");

const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const searchInput = document.getElementById("searchInput");

const toast = document.getElementById("toast");

const exportButton = document.getElementById("exportButton");
const importInput = document.getElementById("importInput");


/* =========================================
   LOAD DATA
========================================= */

function loadData() {

    try {

        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            passwords = [];
            return;
        }

        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            passwords = parsed;
        } else {
            passwords = [];
        }

    } catch (error) {

        console.error("Failed to load local data:", error);

        passwords = [];
    }
}


/* =========================================
   SAVE DATA
========================================= */

function saveData() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(passwords)
        );

    } catch (error) {

        console.error("Failed to save data:", error);

        showToast(
            "Could not save data to this browser.",
            "error"
        );
    }
}


/* =========================================
   TOAST
========================================= */

let toastTimer = null;

function showToast(message, type = "") {

    clearTimeout(toastTimer);

    toast.textContent = message;

    toast.className = "toast";

    if (type) {
        toast.classList.add(type);
    }

    requestAnimationFrame(() => {
        toast.classList.add("show");
    });

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}


/* =========================================
   ADD PASSWORD
========================================= */

function addPassword() {

    /*
     * IMPORTANT:
     *
     * We use trim ONLY to check whether
     * the input is empty.
     *
     * We DO NOT modify the actual value.
     *
     * Therefore:
     * " My Password "
     * stays exactly:
     * " My Password "
     */

    const value = pwInput.value;

    if (!value.trim()) {

        showToast(
            "Please enter a password combination.",
            "error"
        );

        pwInput.focus();

        return;
    }


    /*
     * Exact duplicate check.
     *
     * Case-sensitive.
     * Spaces-sensitive.
     *
     * Example:
     *
     * "Password"
     * "password"
     * "Password "
     *
     * are treated as different entries.
     */

    const existingIndex = passwords.findIndex(
        item => item.text === value
    );


    if (existingIndex !== -1) {

        /*
         * Array index + 1 is the original attempt number.
         */

        const attemptNumber = existingIndex + 1;

        showToast(
            `This combination already exists as attempt #${attemptNumber}.`,
            "error"
        );

        pwInput.select();

        return;
    }


    /*
     * unshift() puts the new item
     * at the TOP of the list.
     */

    passwords.unshift({

        id: createId(),

        text: value,

        status: "pending",

        createdAt: new Date().toISOString()

    });


    saveData();

    pwInput.value = "";

    render();

    showToast(
        "Password combination added.",
        "success"
    );

    pwInput.focus();
}


/* =========================================
   CREATE ID
========================================= */

function createId() {

    if (
        window.crypto &&
        typeof crypto.randomUUID === "function"
    ) {
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
    );
}


/* =========================================
   MARK STATUS
========================================= */

function markStatus(index, status) {

    const item = passwords[index];

    if (!item) {
        return;
    }


    /*
     * Clicking the same status again
     * returns it to pending.
     */

    if (item.status === status) {

        item.status = "pending";

    } else {

        item.status = status;
    }


    saveData();

    render();
}


/* =========================================
   DELETE
========================================= */

function deleteItem(index) {

    const item = passwords[index];

    if (!item) {
        return;
    }


    const confirmed = confirm(
        "Delete this password attempt?"
    );


    if (!confirmed) {
        return;
    }


    passwords.splice(index, 1);

    saveData();

    render();

    showToast(
        "Attempt deleted.",
        "success"
    );
}


/* =========================================
   COPY
========================================= */

async function copyText(text) {

    try {

        /*
         * Modern clipboard API
         */

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(text);

        } else {

            /*
             * Fallback for browsers where
             * Clipboard API isn't available.
             */

            fallbackCopy(text);
        }


        showToast(
            "Password copied to clipboard.",
            "success"
        );


    } catch (error) {

        console.error("Copy failed:", error);

        /*
         * Try fallback once more.
         */

        try {

            fallbackCopy(text);

            showToast(
                "Password copied to clipboard.",
                "success"
            );

        } catch (fallbackError) {

            showToast(
                "Could not copy password.",
                "error"
            );
        }
    }
}


/* =========================================
   COPY FALLBACK
========================================= */

function fallbackCopy(text) {

    const textarea = document.createElement("textarea");

    textarea.value = text;

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.top = "0";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();

    const successful = document.execCommand("copy");

    document.body.removeChild(textarea);

    if (!successful) {
        throw new Error("Fallback copy failed.");
    }
}


/* =========================================
   SEARCH
========================================= */

function handleSearch() {

    searchQuery = searchInput.value;

    render();
}


/* =========================================
   FILTER
========================================= */

function setFilter(filter) {

    currentFilter = filter;


    document
        .querySelectorAll(".filter-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.filter === filter
            );

        });


    render();
}


/* =========================================
   GET FILTERED ITEMS
========================================= */

function getVisibleItems() {

    return passwords.filter(item => {

        const matchesSearch =
            item.text
                .toLowerCase()
                .includes(searchQuery.toLowerCase());


        let matchesFilter = true;


        if (currentFilter === "pending") {
            matchesFilter = item.status === "pending";
        }

        if (currentFilter === "failed") {
            matchesFilter = item.status === "no";
        }

        if (currentFilter === "success") {
            matchesFilter = item.status === "yes";
        }


        return matchesSearch && matchesFilter;
    });
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================================
   RENDER
========================================= */

function render() {

    updateStats();

    const visibleItems = getVisibleItems();

    list.innerHTML = "";


    if (visibleItems.length === 0) {

        const message =
            passwords.length === 0
                ? "No password attempts yet."
                : "No matching attempts found.";

        const subtitle =
            passwords.length === 0
                ? "Add your first password combination above."
                : "Try another search or filter.";


        list.innerHTML = `

            <div class="empty">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.7"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M12 3v2"></path>
                    <path d="M12 19v2"></path>
                    <path d="M4.2 4.2l1.4 1.4"></path>
                    <path d="M18.4 18.4l1.4 1.4"></path>
                    <path d="M3 12h2"></path>
                    <path d="M19 12h2"></path>

                    <circle cx="12" cy="12" r="5"></circle>

                </svg>

                <div class="empty-title">
                    ${escapeHtml(message)}
                </div>

                <div class="empty-subtitle">
                    ${escapeHtml(subtitle)}
                </div>

            </div>
        `;

        return;
    }


    /*
     * Because passwords are stored newest-first,
     * the visible order is also newest-first.
     *
     * The original attempt number is based on
     * its current position in the master array.
     */

    visibleItems.forEach(item => {

        const originalIndex =
            passwords.indexOf(item);

        const attemptNumber =
            originalIndex + 1;

        const isSuccess =
            item.status === "yes";

        const isFailed =
            item.status === "no";


        const card = document.createElement("article");

        card.className =
            "item " +
            (isSuccess
                ? "success"
                : isFailed
                    ? "failed"
                    : "");


        card.innerHTML = `

            <div class="item-top">

                <span class="attempt-number">
                    #${attemptNumber}
                </span>

                <div class="actions">

                    <button
                        type="button"
                        class="icon-btn"
                        data-action="copy"
                        data-index="${originalIndex}"
                        aria-label="Copy password"
                        title="Copy"
                    >
                        ${icons.copy}
                    </button>


                    <button
                        type="button"
                        class="icon-btn ${
                            isSuccess ? "success-active" : ""
                        }"
                        data-action="success"
                        data-index="${originalIndex}"
                        aria-label="Mark as successful"
                        title="Mark successful"
                    >
                        ${icons.check}
                    </button>


                    <button
                        type="button"
                        class="icon-btn ${
                            isFailed ? "failed-active" : ""
                        }"
                        data-action="failed"
                        data-index="${originalIndex}"
                        aria-label="Mark as failed"
                        title="Mark failed"
                    >
                        ${icons.close}
                    </button>


                    <button
                        type="button"
                        class="icon-btn"
                        data-action="delete"
                        data-index="${originalIndex}"
                        aria-label="Delete attempt"
                        title="Delete"
                    >
                        ${icons.trash}
                    </button>

                </div>

            </div>


            <div class="password-text">
                ${escapeHtml(item.text)}
            </div>


            <div class="item-bottom">

                <span class="status ${
                    isSuccess
                        ? "success"
                        : isFailed
                            ? "failed"
                            : ""
                }">
                    ${
                        isSuccess
                            ? "SUCCESS"
                            : isFailed
                                ? "FAILED"
                                : "PENDING"
                    }
                </span>


                <span class="date">
                    ${formatDate(item.createdAt)}
                </span>

            </div>

        `;


        list.appendChild(card);
    });
}


/* =========================================
   STATS
========================================= */

function updateStats() {

    const total = passwords.length;

    const tried =
        passwords.filter(
            item => item.status !== "pending"
        ).length;

    const success =
        passwords.filter(
            item => item.status === "yes"
        ).length;


    totalCount.textContent = total;
    triedCount.textContent = tried;
    successCount.textContent = success;


    const progress =
        total === 0
            ? 0
            : Math.round((tried / total) * 100);


    progressBar.style.width = `${progress}%`;

    progressText.textContent =
        `${progress}%`;
}


/* =========================================
   DATE FORMAT
========================================= */

function formatDate(dateString) {

    if (!dateString) {
        return "";
    }

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
        return "";
    }


    return date.toLocaleString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================
   CARD ACTIONS
========================================= */

list.addEventListener("click", function(event) {

    const button =
        event.target.closest("[data-action]");


    if (!button) {
        return;
    }


    const index =
        Number(button.dataset.index);

    const action =
        button.dataset.action;


    if (!Number.isInteger(index)) {
        return;
    }


    if (action === "copy") {

        const item = passwords[index];

        if (item) {
            copyText(item.text);
        }

    }


    else if (action === "success") {

        markStatus(index, "yes");

    }


    else if (action === "failed") {

        markStatus(index, "no");

    }


    else if (action === "delete") {

        deleteItem(index);

    }

});

/* =========================================
   EXPORT BACKUP
========================================= */

exportButton.addEventListener(
    "click",
    function() {

        if (passwords.length === 0) {

            showToast(
                "There is no data to export.",
                "error"
            );

            return;
        }


        const backup = {

            app: "Get Back My Key",

            version: 1,

            exportedAt:
                new Date().toISOString(),

            attempts: passwords

        };


        const blob = new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type: "application/json"
            }
        );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            `get-back-my-key-backup-${formatFileDate()}.json`;


        document.body.appendChild(link);

        link.click();

        link.remove();


        URL.revokeObjectURL(url);


        showToast(
            "Backup exported successfully.",
            "success"
        );
    }
);


/* =========================================
   IMPORT BACKUP
========================================= */

importInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload = function() {

            try {

                const data =
                    JSON.parse(reader.result);


                let importedAttempts = null;


                /*
                 * Supports our backup format.
                 */

                if (
                    data &&
                    Array.isArray(data.attempts)
                ) {

                    importedAttempts =
                        data.attempts;

                }

                /*
                 * Also supports importing
                 * a plain array.
                 */

                else if (
                    Array.isArray(data)
                ) {

                    importedAttempts =
                        data;

                }


                if (!importedAttempts) {

                    throw new Error(
                        "Invalid backup format."
                    );
                }


                const cleaned =
                    importedAttempts
                        .filter(
                            item =>
                                item &&
                                typeof item.text === "string"
                        )
                        .map(item => ({

                            id:
                                item.id ||
                                createId(),

                            text:
                                item.text,

                            status:
                                ["pending", "yes", "no"]
                                    .includes(item.status)
                                    ? item.status
                                    : "pending",

                            createdAt:
                                item.createdAt ||
                                new Date().toISOString()

                        }));


                /*
                 * Remove exact duplicates
                 * while preserving order.
                 */

                const seen =
                    new Set();


                const unique =
                    cleaned.filter(item => {

                        if (
                            seen.has(item.text)
                        ) {
                            return false;
                        }

                        seen.add(item.text);

                        return true;
                    });


                const replace =
                    confirm(
                        `Import ${unique.length} attempts?\n\n` +
                        "OK = Replace current data\n" +
                        "Cancel = Merge with current data"
                    );


                if (replace) {

                    passwords = unique;

                } else {

                    /*
                     * Merge imported data with
                     * existing data.
                     *
                     * Existing data remains first,
                     * imported unique items are added after.
                     */

                    const existingTexts =
                        new Set(
                            passwords.map(
                                item => item.text
                            )
                        );


                    const newItems =
                        unique.filter(
                            item =>
                                !existingTexts.has(
                                    item.text
                                )
                        );


                    passwords = [
                        ...passwords,
                        ...newItems
                    ];
                }


                saveData();

                render();


                showToast(
                    "Backup imported successfully.",
                    "success"
                );


            } catch (error) {

                console.error(
                    "Import error:",
                    error
                );


                showToast(
                    "Invalid backup file.",
                    "error"
                );
            }


            /*
             * Allows importing the same file again.
             */

            importInput.value = "";
        };


        reader.readAsText(file);
    }
);


/* =========================================
   FILE DATE
========================================= */

function formatFileDate() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;
}
