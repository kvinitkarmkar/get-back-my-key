<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#09090b">

  <title>Get Back My Key</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #09090b;
      --surface: #111113;
      --surface-2: #18181b;
      --surface-3: #202023;

      --border: #27272a;

      --text: #fafafa;
      --muted: #a1a1aa;
      --muted-2: #71717a;

      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
    }

    html {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(59, 130, 246, 0.12),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       ICONS
    ========================= */

    .icon {
      width: 18px;
      height: 18px;

      display: block;

      fill: none;
      stroke: currentColor;

      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-sm {
      width: 16px;
      height: 16px;
    }

    .icon-lg {
      width: 24px;
      height: 24px;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: min(760px, 100%);

      margin: 0 auto;

      padding:
        28px
        16px
        45px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;

      margin-bottom: 26px;
    }

    .logo {
      width: 54px;
      height: 54px;

      margin:
        0
        auto
        14px;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #d4d4d8;

      background:
        var(--surface-2);

      border:
        1px solid var(--border);

      border-radius: 16px;

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0;

      font-size: 24px;
      font-weight: 700;

      letter-spacing: -0.6px;
    }

    .subtitle {
      max-width: 500px;

      margin:
        8px
        auto
        0;

      color:
        var(--muted);

      font-size: 13px;

      line-height: 1.55;
    }

    /* =========================
       ADD
    ========================= */

    .add-card {
      display: flex;

      gap: 10px;

      padding: 10px;

      background:
        rgba(17, 17, 19, 0.9);

      border:
        1px solid var(--border);

      border-radius: 17px;
    }

    .input-wrapper {
      flex: 1;
      min-width: 0;
    }

    .add-card input {
      width: 100%;
      height: 48px;

      padding:
        0
        14px;

      background:
        var(--surface-2);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-radius: 12px;

      outline: none;

      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .add-card input::placeholder {
      color:
        var(--muted-2);
    }

    .add-card input:focus {
      border-color:
        rgba(59, 130, 246, 0.7);

      box-shadow:
        0 0 0 3px
        rgba(59, 130, 246, 0.1);
    }

    .add-btn {
      height: 48px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      padding:
        0
        18px;

      background:
        var(--blue);

      color:
        white;

      border: none;

      border-radius: 12px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .add-btn:hover {
      filter:
        brightness(1.08);
    }

    .add-btn:active {
      transform:
        scale(0.97);
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin:
        18px
        0
        12px;
    }

    .stat {
      padding:
        13px
        10px;

      text-align: center;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 14px;
    }

    .stat-number {
      display: block;

      font-size: 19px;
      font-weight: 700;
    }

    .stat-label {
      display: block;

      margin-top: 4px;

      color:
        var(--muted);

      font-size: 10px;
      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 0.6px;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      display: flex;

      gap: 8px;

      margin:
        12px
        0;
    }

    .search-box {
      position: relative;

      flex: 1;
    }

    .search-box .search-icon {
      position: absolute;

      left: 13px;
      top: 50%;

      transform:
        translateY(-50%);

      color:
        var(--muted-2);

      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      height: 42px;

      padding:
        0
        13px
        0
        40px;

      background:
        var(--surface);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-radius: 11px;

      outline: none;

      font-size: 13px;
    }

    .search-box input:focus {
      border-color:
        rgba(59, 130, 246, 0.55);
    }

    .filter-btn {
      height: 42px;

      padding:
        0
        13px;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      background:
        var(--surface);

      color:
        var(--muted);

      border:
        1px solid var(--border);

      border-radius: 11px;

      cursor: pointer;

      font-size: 12px;
    }

    .filter-btn:hover {
      color:
        var(--text);

      background:
        var(--surface-2);
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
      display: flex;

      gap: 6px;

      overflow-x: auto;

      margin-bottom:
        12px;

      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex-shrink: 0;

      padding:
        7px
        11px;

      background:
        transparent;

      color:
        var(--muted);

      border:
        1px solid transparent;

      border-radius:
        999px;

      cursor: pointer;

      font-size: 11px;
      font-weight: 600;
    }

    .filter:hover {
      color:
        var(--text);
    }

    .filter.active {
      color:
        var(--text);

      background:
        var(--surface-2);

      border-color:
        var(--border);
    }

    /* =========================
       LIST
    ========================= */

    #list {
      display: flex;

      flex-direction: column;

      gap: 9px;
    }

    .item {
      display: flex;

      align-items: center;

      gap: 10px;

      min-width: 0;

      padding: 12px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-left-width:
        3px;

      border-radius:
        15px;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .item:hover {
      background:
        #141416;

      transform:
        translateY(-1px);
    }

    .item.pending {
      border-left-color:
        #52525b;
    }

    .item.done-yes {
      border-left-color:
        var(--green);
    }

    .item.done-no {
      border-left-color:
        var(--red);
    }

    /* =========================
       PASSWORD
    ========================= */

    .password-content {
      flex: 1;

      min-width: 0;
    }

    .attempt-line {
      display: flex;

      align-items: center;

      gap: 7px;

      margin-bottom:
        5px;
    }

    .attempt-number {
      color:
        var(--muted-2);

      font-size: 10px;
      font-weight: 700;

      letter-spacing:
        0.3px;
    }

    .pw-text {
      display: block;

      color:
        var(--text);

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 14px;

      line-height:
        1.5;

      /*
        IMPORTANT:
        Preserve exactly what user entered,
        including spaces and line breaks.
      */
      white-space: pre-wrap;

      word-break: break-word;
    }

    .date {
      margin-top:
        6px;

      color:
        var(--muted-2);

      font-size: 10px;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      display: inline-flex;

      align-items: center;

      gap: 4px;

      margin-top:
        6px;

      padding:
        3px
        8px;

      border-radius:
        999px;

      font-size: 9px;
      font-weight: 700;

      text-transform:
        uppercase;

      letter-spacing:
        0.5px;
    }

    .status.pending {
      color:
        #a1a1aa;

      background:
        #27272a;
    }

    .status.success {
      color:
        #86efac;

      background:
        rgba(34, 197, 94, 0.12);
    }

    .status.failed {
      color:
        #fca5a5;

      background:
        rgba(239, 68, 68, 0.12);
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: flex;

      align-items: center;

      gap: 5px;

      flex-shrink: 0;
    }

    .action-btn {
      width: 36px;
      height: 36px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 0;

      background:
        var(--surface-2);

      color:
        #a1a1aa;

      border:
        1px solid var(--border);

      border-radius:
        10px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .action-btn:hover {
      background:
        var(--surface-3);

      color:
        var(--text);
    }

    .action-btn:active {
      transform:
        scale(0.93);
    }

    .action-btn.success.active {
      background:
        rgba(34, 197, 94, 0.12);

      border-color:
        rgba(34, 197, 94, 0.4);

      color:
        var(--green);
    }

    .action-btn.failed.active {
      background:
        rgba(239, 68, 68, 0.12);

      border-color:
        rgba(239, 68, 68, 0.4);

      color:
        var(--red);
    }

    .action-btn.copied {
      background:
        rgba(34, 197, 94, 0.12);

      border-color:
        rgba(34, 197, 94, 0.4);

      color:
        var(--green);
    }

    .action-btn.delete:hover {
      color:
        var(--red);

      border-color:
        rgba(239, 68, 68, 0.35);
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding:
        50px
        20px;

      text-align: center;

      background:
        var(--surface);

      border:
        1px dashed var(--border);

      border-radius:
        16px;
    }

    .empty-icon {
      width: 46px;
      height: 46px;

      margin:
        0
        auto
        13px;

      display: flex;

      align-items: center;
      justify-content: center;

      color:
        var(--muted);

      background:
        var(--surface-2);

      border:
        1px solid var(--border);

      border-radius:
        14px;
    }

    .empty-title {
      font-size:
        14px;

      font-weight:
        600;
    }

    .empty-text {
      max-width:
        320px;

      margin:
        6px
        auto
        0;

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.5;
    }

    /* =========================
       BACKUP
    ========================= */

    .backup {
      display: flex;

      gap: 8px;

      margin-top:
        18px;
    }

    .backup-btn {
      flex: 1;

      height: 40px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      color:
        var(--muted);

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius:
        10px;

      cursor: pointer;

      font-size:
        11px;

      font-weight:
        600;
    }

    .backup-btn:hover {
      color:
        var(--text);

      background:
        var(--surface-2);
    }

    /* =========================
       STORAGE
    ========================= */

    .storage-status {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      margin-top:
        16px;

      color:
        var(--muted-2);

      font-size:
        10px;
    }

    .storage-dot {
      width: 6px;
      height: 6px;

      border-radius:
        50%;

      background:
        var(--green);

      box-shadow:
        0 0 8px
        rgba(34, 197, 94, 0.5);
    }

    /* =========================
       PROGRESS
    ========================= */

    .progress-wrap {
      margin:
        4px
        0
        14px;
    }

    .progress-info {
      display: flex;

      justify-content: space-between;

      margin-bottom:
        6px;

      color:
        var(--muted-2);

      font-size:
        10px;
    }

    .progress {
      width: 100%;
      height: 4px;

      overflow:
        hidden;

      background:
        var(--surface-3);

      border-radius:
        999px;
    }

    .progress-bar {
      height: 100%;

      width: 0%;

      background:
        var(--green);

      border-radius:
        inherit;

      transition:
        width 0.25s ease;
    }

    /* =========================
       TOAST
    ========================= */

    #toastContainer {
      position: fixed;

      left: 50%;
      bottom: 22px;

      z-index: 1000;

      transform:
        translateX(-50%);

      width:
        min(420px, calc(100% - 24px));

      pointer-events:
        none;
    }

    .toast {
      display: flex;

      align-items: center;

      gap: 10px;

      padding:
        12px
        14px;

      background:
        #18181b;

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-radius:
        12px;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.4);

      font-size:
        12px;

      animation:
        toastIn
        0.2s
        ease;
    }

    .toast.success {
      border-color:
        rgba(34, 197, 94, 0.35);
    }

    .toast.error {
      border-color:
        rgba(239, 68, 68, 0.35);
    }

    .toast-content {
      flex: 1;
    }

    .toast-title {
      font-weight:
        700;
    }

    .toast-message {
      margin-top:
        2px;

      color:
        var(--muted);

      font-size:
        11px;
    }

    .undo-btn {
      padding:
        5px
        8px;

      color:
        #93c5fd;

      background:
        transparent;

      border:
        0;

      cursor:
        pointer;

      font-size:
        11px;

      font-weight:
        700;
    }

    @keyframes toastIn {

      from {
        opacity: 0;
        transform:
          translateY(8px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 560px) {

      .container {
        padding:
          22px
          12px
          35px;
      }

      .logo {
        width:
          50px;

        height:
          50px;
      }

      h1 {
        font-size:
          21px;
      }

      .subtitle {
        font-size:
          12px;
      }

      .add-card {
        padding:
          9px;
      }

      .add-card input,
      .add-btn {
        height:
          45px;
      }

      .add-btn {
        padding:
          0
          15px;
      }

      .stats {
        gap:
          7px;
      }

      .stat {
        padding:
          11px
          6px;
      }

      .stat-number {
        font-size:
          17px;
      }

      .item {
        align-items:
          flex-start;

        padding:
          11px;
      }

      .actions {
        gap:
          4px;
      }

      .action-btn {
        width:
          33px;

        height:
          33px;

        border-radius:
          9px;
      }

      .pw-text {
        font-size:
          13px;
      }
    }

    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

      .add-card {
        flex-direction:
          column;
      }

      .add-btn {
        width:
          100%;
      }

      .toolbar {
        flex-direction:
          column;
      }

      .filter-btn {
        width:
          100%;

        justify-content:
          center;
      }

      .item {
        gap:
          7px;
      }

      .actions {
        gap:
          3px;
      }

      .action-btn {
        width:
          30px;

        height:
          30px;
      }

    }

  </style>

</head>


<body>

  <main class="container">

    <!-- HEADER -->

    <header class="header">

      <div class="logo">

        <svg
          class="icon icon-lg"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="8"
            cy="15"
            r="4"
          ></circle>

          <path
            d="M10.8 12.2 20 3"
          ></path>

          <path
            d="m16 7 2 2"
          ></path>

          <path
            d="m18 5 2 2"
          ></path>

        </svg>

      </div>

      <h1>
        Get Back My Key
      </h1>

      <p class="subtitle">
        Keep track of password combinations and your recovery attempts.
      </p>

    </header>


    <!-- ADD PASSWORD -->

    <section class="add-card">

      <div class="input-wrapper">

        <input
          type="text"
          id="pwInput"
          autocomplete="off"
          spellcheck="false"
          placeholder="Enter password combination..."
        >

      </div>

      <button
        class="add-btn"
        id="addBtn"
        type="button"
      >

        <svg
          class="icon icon-sm"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>

        </svg>

        <span>
          Add
        </span>

      </button>

    </section>


    <!-- STATS -->

    <section class="stats">

      <div class="stat">

        <span
          class="stat-number"
          id="totalCount"
        >
          0
        </span>

        <span class="stat-label">
          Total
        </span>

      </div>


      <div class="stat">

        <span
          class="stat-number"
          id="triedCount"
        >
          0
        </span>

        <span class="stat-label">
          Tried
        </span>

      </div>


      <div class="stat">

        <span
          class="stat-number"
          id="successCount"
        >
          0
        </span>

        <span class="stat-label">
          Success
        </span>

      </div>

    </section>


    <!-- PROGRESS -->

    <div
      class="progress-wrap"
      id="progressWrap"
      style="display:none;"
    >

      <div class="progress-info">

        <span>
          Recovery progress
        </span>

        <span id="progressText">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

      <div class="search-box">

        <svg
          class="icon icon-sm search-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
          ></circle>

          <path
            d="m20 20-4-4"
          ></path>

        </svg>

        <input
          type="search"
          id="searchInput"
          placeholder="Search attempts..."
          autocomplete="off"
        >

      </div>

    </div>


    <!-- FILTERS -->

    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
        type="button"
      >
        All
      </button>

      <button
        class="filter"
        data-filter="pending"
        type="button"
      >
        Pending
      </button>

      <button
        class="filter"
        data-filter="no"
        type="button"
      >
        Failed
      </button>

      <button
        class="filter"
        data-filter="yes"
        type="button"
      >
        Success
      </button>

    </div>


    <!-- PASSWORD LIST -->

    <section id="list"></section>


    <!-- EMPTY STATE -->

    <div
      class="empty"
      id="emptyMsg"
    >

      <div class="empty-icon">

        <svg
          class="icon icon-lg"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <rect
            x="4"
            y="10"
            width="16"
            height="11"
            rx="2"
          ></rect>

          <path
            d="M8 10V7a4 4 0 0 1 8 0v3"
          ></path>

        </svg>

      </div>

      <div class="empty-title">
        No password attempts yet
      </div>

      <div class="empty-text">
        Add your first combination above to start tracking.
      </div>

    </div>


    <!-- BACKUP -->

    <div class="backup">

      <button
        class="backup-btn"
        id="exportBtn"
        type="button"
      >

        <svg
          class="icon icon-sm"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path d="M12 3v12"></path>

          <path d="m7 10 5 5 5-5"></path>

          <path
            d="M5 21h14"
          ></path>

        </svg>

        Export Backup

      </button>


      <button
        class="backup-btn"
        id="importBtn"
        type="button"
      >

        <svg
          class="icon icon-sm"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path d="M12 15V3"></path>

          <path d="m7 8 5-5 5 5"></path>

          <path
            d="M5 21h14"
          ></path>

        </svg>

        Import Backup

      </button>

    </div>


    <input
      type="file"
      id="fileInput"
      accept=".json,application/json"
      hidden
    >


    <!-- STORAGE -->

    <div class="storage-status">

      <span class="storage-dot"></span>

      <span id="storageText">
        Saved locally in this browser
      </span>

    </div>

  </main>


  <!-- TOAST -->

  <div id="toastContainer"></div>


  <script>

    /* =========================================
       CONFIG
    ========================================= */

    const STORAGE_KEY =
      "get_back_my_key_passwords_v3";


    /* =========================================
       STATE
    ========================================= */

    let passwords =
      loadPasswords();

    let currentFilter =
      "all";

    let searchQuery =
      "";

    let deletedBackup =
      null;

    let undoTimeout =
      null;


    /* =========================================
       LOAD STORAGE
    ========================================= */

    function loadPasswords() {

      try {

        const saved =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!saved) {
          return [];
        }


        const parsed =
          JSON.parse(saved);


        if (!Array.isArray(parsed)) {
          return [];
        }


        return parsed.filter(
          item =>
            item &&
            typeof item.text === "string"
        );

      } catch (error) {

        console.error(
          "Storage load failed:",
          error
        );

        return [];
      }
    }


    /* =========================================
       SAVE STORAGE
    ========================================= */

    function savePasswords() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(passwords)
        );


        updateStorageStatus(
          true
        );


        return true;

      } catch (error) {

        console.error(
          "Storage save failed:",
          error
        );


        updateStorageStatus(
          false
        );


        return false;
      }
    }


    /* =========================================
       STORAGE STATUS
    ========================================= */

    function updateStorageStatus(
      saved
    ) {

      const text =
        document.getElementById(
          "storageText"
        );


      text.textContent =
        saved
          ? "Saved locally in this browser"
          : "Could not save to browser storage";
    }


    /* =========================================
       ADD
       
       IMPORTANT:
       NO trim().
       The exact input is preserved.
    ========================================= */

    function addPassword() {

      const input =
        document.getElementById(
          "pwInput"
        );


      /*
        DO NOT trim this.

        If user enters:

          "  my pass  "

        those spaces are intentionally
        preserved.
      */

      const value =
        input.value;


      /*
        Only reject a completely empty input.

        Spaces-only input is technically valid
        and will therefore be preserved.
      */

      if (value.length === 0) {

        input.focus();

        return;
      }


      /* =====================================
         EXACT DUPLICATE CHECK
         
         No trim.
         No lowercase.
         No normalization.
         
         "Pass"
         "pass"
         "Pass "
         " Pass"
         
         are all different.
      ===================================== */

      const duplicate =
        passwords.find(
          password =>
            password.text === value
        );


      if (duplicate) {

        showToast(
          "Already exists",
          "This exact combination is already in your list.",
          "error"
        );


        input.focus();

        input.select();


        return;
      }


      /* =====================================
         NEW ENTRY
         
         unshift = TOP
      ===================================== */

      const newPassword = {

        id:
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2),

        text:
          value,

        status:
          "pending",

        createdAt:
          new Date().toISOString()

      };


      passwords.unshift(
        newPassword
      );


      savePasswords();


      input.value =
        "";


      render();


      input.focus();


      showToast(
        "Added",
        "New combination added to the top of your list.",
        "success"
      );
    }


    /* =========================================
       ADD BUTTON
    ========================================= */

    document
      .getElementById(
        "addBtn"
      )
      .addEventListener(
        "click",
        addPassword
      );


    /* =========================================
       ENTER KEY
    ========================================= */

    document
      .getElementById(
        "pwInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            event.preventDefault();

            addPassword();
          }

        }
      );


    /* =========================================
       STATUS
    ========================================= */

    function markStatus(
      index,
      status
    ) {

      if (!passwords[index]) {
        return;
      }


      if (
        passwords[index].status ===
        status
      ) {

        passwords[index].status =
          "pending";

      } else {

        passwords[index].status =
          status;
      }


      savePasswords();

      render();
    }


    /* =========================================
       DELETE
    ========================================= */

    function deleteItem(
      index
    ) {

      if (!passwords[index]) {
        return;
      }


      const item =
        passwords[index];


      const confirmed =
        confirm(
          "Delete this password attempt?"
        );


      if (!confirmed) {
        return;
      }


      deletedBackup = {

        item:
          item,

        index:
          index

      };


      passwords.splice(
        index,
        1
      );


      savePasswords();

      render();


      showUndoToast(
        "Deleted",
        "The password attempt was removed."
      );
    }


    /* =========================================
       UNDO DELETE
    ========================================= */

    function undoDelete() {

      if (!deletedBackup) {
        return;
      }


      passwords.splice(
        deletedBackup.index,
        0,
        deletedBackup.item
      );


      savePasswords();

      render();


      deletedBackup =
        null;


      if (undoTimeout) {

        clearTimeout(
          undoTimeout
        );

        undoTimeout =
          null;
      }


      showToast(
        "Restored",
        "The deleted attempt was restored.",
        "success"
      );
    }


    /* =========================================
       COPY
    ========================================= */

    async function copyText(
      text,
      button
    ) {

      let copied =
        false;


      /* Modern API */

      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          await navigator.clipboard.writeText(
            text
          );

          copied =
            true;
        }

      } catch (error) {

        console.log(
          "Clipboard API failed"
        );
      }


      /* Fallback */

      if (!copied) {

        try {

          const textarea =
            document.createElement(
              "textarea"
            );


          textarea.value =
            text;


          textarea.setAttribute(
            "readonly",
            ""
          );


          textarea.style.position =
            "fixed";

          textarea.style.left =
            "-9999px";

          textarea.style.top =
            "0";

          textarea.style.opacity =
            "0";


          document.body.appendChild(
            textarea
          );


          textarea.focus();

          textarea.select();


          textarea.setSelectionRange(
            0,
            textarea.value.length
          );


          copied =
            document.execCommand(
              "copy"
            );


          document.body.removeChild(
            textarea
          );

        } catch (error) {

          console.error(
            "Copy failed:",
            error
          );
        }
      }


      if (copied) {

        const original =
          button.innerHTML;


        button.innerHTML = `

          <svg
            class="icon icon-sm"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="m5 12 4 4L19 6"
            ></path>

          </svg>

        `;


        button.classList.add(
          "copied"
        );


        setTimeout(
          function() {

            button.innerHTML =
              original;

            button.classList.remove(
              "copied"
            );

          },
          1200
        );


      } else {

        showToast(
          "Copy failed",
          "Please copy the combination manually.",
          "error"
        );
      }
    }


    /* =========================================
       SEARCH
    ========================================= */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        function(event) {

          searchQuery =
            event.target.value;

          render();

        }
      );


    /* =========================================
       FILTER
    ========================================= */

    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  btn =>
                    btn.classList.remove(
                      "active"
                    )
                );


              this.classList.add(
                "active"
              );


              currentFilter =
                this.dataset.filter;


              render();

            }
          );

        }
      );


    /* =========================================
       EXPORT
    ========================================= */

    document
      .getElementById(
        "exportBtn"
      )
      .addEventListener(
        "click",
        exportBackup
      );


    function exportBackup() {

      if (
        passwords.length === 0
      ) {

        showToast(
          "Nothing to export",
          "There are no password attempts yet.",
          "error"
        );

        return;
      }


      const backup = {

        app:
          "Get Back My Key",

        version:
          3,

        exportedAt:
          new Date().toISOString(),

        passwords:
          passwords

      };


      const json =
        JSON.stringify(
          backup,
          null,
          2
        );


      const blob =
        new Blob(
          [json],
          {
            type:
              "application/json"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      const date =
        new Date()
          .toISOString()
          .slice(
            0,
            10
          );


      link.href =
        url;


      link.download =
        `get-back-my-key-${date}.json`;


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      URL.revokeObjectURL(
        url
      );


      showToast(
        "Backup exported",
        "Your local backup file has been created.",
        "success"
      );
    }


    /* =========================================
       IMPORT
    ========================================= */

    document
      .getElementById(
        "importBtn"
      )
      .addEventListener(
        "click",
        function() {

          document
            .getElementById(
              "fileInput"
            )
            .click();

        }
      );


    document
      .getElementById(
        "fileInput"
      )
      .addEventListener(
        "change",
        importBackup
      );


    function importBackup(
      event
    ) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function() {

          try {

            const data =
              JSON.parse(
                reader.result
              );


            let imported;


            /*
              Support both:

              {
                passwords: [...]
              }

              and directly:
              [...]
            */

            if (
              Array.isArray(data)
            ) {

              imported =
                data;

            } else if (
              Array.isArray(
                data.passwords
              )
            ) {

              imported =
                data.passwords;

            } else {

              throw new Error(
                "Invalid backup format"
              );
            }


            /*
              Only accept valid entries.
            */

            imported =
              imported.filter(
                item =>
                  item &&
                  typeof item.text ===
                    "string"
              );


            if (
              imported.length === 0
            ) {

              throw new Error(
                "No valid entries found"
              );
            }


            /*
              Merge while preserving exact
              password strings.
            */

            let added =
              0;


            imported.forEach(
              function(item) {

                const exists =
                  passwords.some(
                    existing =>
                      existing.text ===
                      item.text
                  );


                if (!exists) {

                  passwords.push({

                    id:
                      item.id ||
                      Date.now() +
                      "_" +
                      Math.random()
                        .toString(36)
                        .slice(2),

                    text:
                      item.text,

                    status:
                      item.status === "yes" ||
                      item.status === "no"
                        ? item.status
                        : "pending",

                    createdAt:
                      item.createdAt ||
                      new Date().toISOString()

                  });


                  added++;
                }

              }
            );


            savePasswords();

            render();


            showToast(
              "Backup imported",
              `${added} new ${added === 1 ? "entry" : "entries"} added.`,
              "success"
            );


          } catch (error) {

            console.error(
              error
            );


            showToast(
              "Import failed",
              "The selected file is not a valid backup.",
              "error"
            );

          }


          event.target.value =
            "";

        };


      reader.readAsText(
        file
      );
    }


    /* =========================================
       TOAST
    ========================================= */

    function showToast(
      title,
      message,
      type = "success"
    ) {

      const container =
        document.getElementById(
          "toastContainer"
        );


      container.innerHTML =
        "";


      const toast =
        document.createElement(
          "div"
        );


      toast.className =
        "toast " +
        type;


      toast.innerHTML = `

        <div class="toast-content">

          <div class="toast-title">
            ${escapeHtml(title)}
          </div>

          <div class="toast-message">
            ${escapeHtml(message)}
          </div>

        </div>

      `;


      container.appendChild(
        toast
      );


      setTimeout(
        function() {

          toast.remove();

        },
        3000
      );
    }


    /* =========================================
       UNDO TOAST
    ========================================= */

    function showUndoToast(
      title,
      message
    ) {

      const container =
        document.getElementById(
          "toastContainer"
        );


      container.innerHTML =
        "";


      const toast =
        document.createElement(
          "div"
        );


      toast.className =
        "toast";


      toast.innerHTML = `

        <div class="toast-content">

          <div class="toast-title">
            ${escapeHtml(title)}
          </div>

          <div class="toast-message">
            ${escapeHtml(message)}
          </div>

        </div>

        <button
          class="undo-btn"
          type="button"
        >
          Undo
        </button>

      `;


      toast
        .querySelector(
          ".undo-btn"
        )
        .addEventListener(
          "click",
          undoDelete
        );


      container.appendChild(
        toast
      );


      undoTimeout =
        setTimeout(
          function() {

            deletedBackup =
              null;

            toast.remove();

          },
          5000
        );
    }


    /* =========================================
       FORMAT DATE
    ========================================= */

    function formatDate(
      dateString
    ) {

      if (!dateString) {
        return "";
      }


      const date =
        new Date(
          dateString
        );


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";
      }


      return date.toLocaleString(
        undefined,
        {
          month:
            "short",

          day:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit"
        }
      );
    }


    /* =========================================
       RENDER
    ========================================= */

    function render() {

      const list =
        document.getElementById(
          "list"
        );


      const empty =
        document.getElementById(
          "emptyMsg"
        );


      list.innerHTML =
        "";


      /* Statistics */

      const total =
        passwords.length;


      const tried =
        passwords.filter(
          item =>
            item.status !==
            "pending"
        ).length;


      const success =
        passwords.filter(
          item =>
            item.status ===
            "yes"
        ).length;


      document.getElementById(
        "totalCount"
      ).textContent =
        total;


      document.getElementById(
        "triedCount"
      ).textContent =
        tried;


      document.getElementById(
        "successCount"
      ).textContent =
        success;


      /* Progress */

      const progressWrap =
        document.getElementById(
          "progressWrap"
        );


      if (total > 0) {

        progressWrap.style.display =
          "block";


        const percentage =
          Math.round(
            (
              success /
              total
            ) *
            100
          );


        document.getElementById(
          "progressBar"
        ).style.width =
          percentage +
          "%";


        document.getElementById(
          "progressText"
        ).textContent =
          percentage +
          "%";

      } else {

        progressWrap.style.display =
          "none";
      }


      /* Filter */

      const filtered =
        passwords.filter(
          function(password) {

            const filterMatch =
              currentFilter ===
                "all" ||
              password.status ===
                currentFilter;


            const searchMatch =
              password.text
                .toLowerCase()
                .includes(
                  searchQuery
                    .toLowerCase()
                );


            return (
              filterMatch &&
              searchMatch
            );

          }
        );


      /* Empty state */

      if (
        filtered.length === 0
      ) {

        if (
          passwords.length === 0
        ) {

          empty.querySelector(
            ".empty-title"
          ).textContent =
            "No password attempts yet";


          empty.querySelector(
            ".empty-text"
          ).textContent =
            "Add your first combination above to start tracking.";

        } else {

          empty.querySelector(
            ".empty-title"
          ).textContent =
            "No matching attempts";


          empty.querySelector(
            ".empty-text"
          ).textContent =
            "Try a different search or filter.";

        }


        empty.style.display =
          "block";

      } else {

        empty.style.display =
          "none";
      }


      /* Render cards */

      filtered.forEach(
        function(password) {

          /*
            Find original index.
            This is important because filtered
            arrays have different indexes.
          */

          const originalIndex =
            passwords.indexOf(
              password
            );


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "item " +
            (
              password.status ===
              "yes"

                ? "done-yes"

                : password.status ===
                  "no"

                  ? "done-no"

                  : "pending"
            );


          let statusClass =
            "pending";

          let statusText =
            "Pending";

          let statusIcon =
            "";


          if (
            password.status ===
            "yes"
          ) {

            statusClass =
              "success";

            statusText =
              "Success";


            statusIcon = `

              <svg
                class="icon"
                style="
                  width:11px;
                  height:11px;
                "
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="m5 12 4 4L19 6"
                ></path>

              </svg>

            `;

          } else if (
            password.status ===
            "no"
          ) {

            statusClass =
              "failed";

            statusText =
              "Failed";


            statusIcon = `

              <svg
                class="icon"
                style="
                  width:11px;
                  height:11px;
                "
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M6 6l12 12"
                ></path>

                <path
                  d="m18 6-12 12"
                ></path>

              </svg>

            `;
          }


          item.innerHTML = `

            <div class="password-content">

              <div class="attempt-line">

                <span class="attempt-number">
                  #${originalIndex + 1}
                </span>

              </div>

              <span class="pw-text">
                ${escapeHtml(
                  password.text
                )}
              </span>

              <span
                class="
                  status
                  ${statusClass}
                "
              >

                ${statusIcon}

                ${statusText}

              </span>

              <div class="date">
                ${escapeHtml(
                  formatDate(
                    password.createdAt
                  )
                )}
              </div>

            </div>


            <div class="actions">

              <!-- COPY -->

              <button
                class="action-btn copy"
                type="button"
                title="Copy"
                aria-label="Copy"
              >

                <svg
                  class="icon icon-sm"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >

                  <rect
                    x="9"
                    y="9"
                    width="11"
                    height="11"
                    rx="2"
                  ></rect>

                  <path
                    d="
                      M5 15H4
                      a2 2 0 0 1-2-2V4
                      a2 2 0 0 1 2-2h9
                      a2 2 0 0 1 2 2v1
                    "
                  ></path>

                </svg>

              </button>


              <!-- SUCCESS -->

              <button
                class="
                  action-btn
                  success
                  ${
                    password.status ===
                    "yes"
                      ? "active"
                      : ""
                  }
                "
                type="button"
                title="Mark successful"
                aria-label="Mark successful"
              >

                <svg
                  class="icon icon-sm"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >

                  <path
                    d="m5 12 4 4L19 6"
                  ></path>

                </svg>

              </button>


              <!-- FAILED -->

              <button
                class="
                  action-btn
                  failed
                  ${
                    password.status ===
                    "no"
                      ? "active"
                      : ""
                  }
                "
                type="button"
                title="Mark failed"
                aria-label="Mark failed"
              >

                <svg
                  class="icon icon-sm"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >

                  <path
                    d="M6 6l12 12"
                  ></path>

                  <path
                    d="m18 6-12 12"
                  ></path>

                </svg>

              </button>


              <!-- DELETE -->

              <button
                class="
                  action-btn
                  delete
                "
                type="button"
                title="Delete"
                aria-label="Delete"
              >

                <svg
                  class="icon icon-sm"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >

                  <path
                    d="M3 6h18"
                  ></path>

                  <path
                    d="M8 6V4h8v2"
                  ></path>

                  <path
                    d="M19 6l-1 15H6L5 6"
                  ></path>

                  <path
                    d="M10 11v6"
                  ></path>

                  <path
                    d="M14 11v6"
                  ></path>

                </svg>

              </button>

            </div>
          `;


          /* Copy */

          item
            .querySelector(
              ".copy"
            )
            .addEventListener(
              "click",
              function() {

                copyText(
                  password.text,
                  this
                );

              }
            );


          /* Success */

          item
            .querySelector(
              ".success"
            )
            .addEventListener(
              "click",
              function() {

                markStatus(
                  originalIndex,
                  "yes"
                );

              }
            );


          /* Failed */

          item
            .querySelector(
              ".failed"
            )
            .addEventListener(
              "click",
              function() {

                markStatus(
                  originalIndex,
                  "no"
                );

              }
            );


          /* Delete */

          item
            .querySelector(
              ".delete"
            )
            .addEventListener(
              "click",
              function() {

                deleteItem(
                  originalIndex
                );

              }
            );


          list.appendChild(
            item
          );

        }
      );
    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =========================================
       INITIAL RENDER
    ========================================= */

    render();

  </script>

</body>

</html>
