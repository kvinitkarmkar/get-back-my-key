<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090c">
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<title>Get Back My Key</title>

<style>
:root {
    --bg: #08090c;
    --surface: #101114;
    --surface-2: #17181c;
    --border: #25262b;
    --border-hover: #35363d;

    --text: #f5f5f7;
    --muted: #92939b;
    --muted-2: #686a72;

    --blue: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(59, 130, 246, 0.08),
            transparent 32%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    -webkit-user-select: none;
    user-select: none;
}


/* =========================================
   APP
========================================= */

.app {
    width: min(100% - 24px, 700px);
    margin: 0 auto;
    padding: 32px 0 28px;
}


/* =========================================
   HEADER
========================================= */

.header {
    text-align: center;
    margin-bottom: 22px;
}

.logo {
    width: 58px;
    height: 58px;

    margin: 0 auto 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #151619;
    border: 1px solid #292a2f;
    border-radius: 18px;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255,255,255,0.04);
}

.logo svg {
    width: 28px;
    height: 28px;
    color: #d8d9de;
}

.header h1 {
    margin: 0;

    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.15;

    letter-spacing: -0.8px;
    font-weight: 750;
}

.header p {
    max-width: 500px;

    margin: 9px auto 0;

    color: var(--muted);

    font-size: 14px;
    line-height: 1.4;
}


/* =========================================
   ADD BOX
========================================= */

.add-box {
    padding: 11px;
    margin-bottom: 15px;

    background: rgba(16, 17, 20, 0.9);

    border: 1px solid var(--border);
    border-radius: 16px;

    box-shadow:
        0 12px 30px rgba(0,0,0,0.15),
        inset 0 1px 0 rgba(255,255,255,0.02);
}

.password-input {
    width: 100%;
    height: 50px;

    padding: 0 14px;

    background: var(--surface-2);
    color: var(--text);

    border: 1px solid #292a2f;
    border-radius: 12px;

    outline: none;

    font-size: 15px;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.password-input::placeholder {
    color: #686a73;
}

.password-input:focus {
    border-color: rgba(59,130,246,.65);

    box-shadow:
        0 0 0 3px rgba(59,130,246,.10);
}

.add-button {
    width: 100%;
    height: 50px;

    margin-top: 8px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    background: var(--blue);
    color: #fff;

    border: 0;
    border-radius: 12px;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background .2s,
        transform .1s;
}

.add-button:hover {
    background: #3275df;
}

.add-button:active {
    transform: scale(.985);
}

.add-button svg {
    width: 19px;
    height: 19px;
}


/* =========================================
   STATS
========================================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 16px;
}

.stat {
    padding: 12px 7px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: 14px;

    text-align: center;
}

.stat-value {
    display: block;

    font-size: 22px;
    line-height: 1;

    font-weight: 750;
}

.stat-label {
    display: block;

    margin-top: 6px;

    color: var(--muted);

    font-size: 9px;
    font-weight: 750;

    letter-spacing: .7px;
}


/* =========================================
   SEARCH
========================================= */

.search-box {
    position: relative;

    margin-bottom: 10px;
}

.search-box svg {
    position: absolute;

    left: 14px;
    top: 50%;

    transform: translateY(-50%);

    width: 18px;
    height: 18px;

    color: #777983;

    pointer-events: none;
}

.search-input {
    width: 100%;
    height: 46px;

    padding: 0 14px 0 43px;

    background: var(--surface);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: 12px;

    outline: none;

    font-size: 14px;
}

.search-input:focus {
    border-color: var(--border-hover);
}

.search-input::placeholder {
    color: #686a73;
}


/* =========================================
   FILTERS
========================================= */

.filters {
    display: flex;
    gap: 4px;

    overflow-x: auto;

    margin-bottom: 11px;
    padding-bottom: 2px;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter-btn {
    flex: 0 0 auto;

    padding: 7px 13px;

    background: transparent;
    color: var(--muted);

    border: 1px solid transparent;
    border-radius: 99px;

    font-size: 13px;
    font-weight: 650;

    cursor: pointer;
}

.filter-btn.active {
    background: #191a1e;

    color: #f1f1f3;

    border-color: #292a2f;
}


/* =========================================
   LIST
========================================= */

#list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}


/* =========================================
   PASSWORD CARD
========================================= */

.item {
    position: relative;

    padding: 10px 10px 10px 12px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-left: 3px solid #414249;

    border-radius: 14px;

    transition:
        border-color .2s,
        transform .1s;
}

.item:hover {
    border-color: var(--border-hover);
}

.item.success {
    border-left-color: var(--green);
}

.item.failed {
    border-left-color: var(--red);
}


/* =========================================
   CARD TOP
========================================= */

.item-top {
    min-height: 32px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.attempt-number {
    color: #70727b;

    font-size: 11px;
    font-weight: 700;
}

.actions {
    display: flex;
    gap: 3px;
}

.icon-btn {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--surface-2);
    color: #8f9199;

    border: 1px solid #292a2f;
    border-radius: 9px;

    cursor: pointer;

    transition:
        background .15s,
        color .15s,
        border-color .15s,
        transform .1s;
}

.icon-btn:hover {
    background: #1d1e22;
    color: #e4e5e8;
    border-color: #37383f;
}

.icon-btn:active {
    transform: scale(.93);
}

.icon-btn svg {
    width: 17px;
    height: 17px;

    stroke-width: 1.8;
}

.icon-btn.success-active {
    color: #86efac;

    border-color: rgba(34,197,94,.35);

    background: rgba(34,197,94,.09);
}

.icon-btn.failed-active {
    color: #fca5a5;

    border-color: rgba(239,68,68,.35);

    background: rgba(239,68,68,.09);
}


/* =========================================
   PASSWORD
========================================= */

.password-text {
    margin-top: 9px;

    color: #f1f1f3;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;

    font-size: 15px;
    line-height: 1.35;

    word-break: break-word;
    overflow-wrap: anywhere;

    /*
       IMPORTANT:
       User ke spaces exactly preserve honge.
    */

    white-space: pre-wrap;
}


/* =========================================
   CARD BOTTOM
========================================= */

.item-bottom {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-top: 8px;
}

.status {
    display: inline-flex;
    align-items: center;

    padding: 4px 9px;

    border-radius: 99px;

    background: #24252a;
    color: #a7a8af;

    font-size: 10px;
    font-weight: 750;

    letter-spacing: .4px;
}

.status.success {
    background: rgba(34,197,94,.12);
    color: #86efac;
}

.status.failed {
    background: rgba(239,68,68,.12);
    color: #fca5a5;
}

.date {
    color: #62646c;
    font-size: 10px;
}


/* =========================================
   EMPTY STATE
========================================= */

.empty {
    padding: 40px 20px;

    text-align: center;

    color: var(--muted-2);

    border: 1px dashed #292a2f;
    border-radius: 15px;
}

.empty svg {
    width: 30px;
    height: 30px;

    margin-bottom: 9px;

    color: #55575f;
}

.empty-title {
    color: #999ba3;

    font-size: 14px;
    font-weight: 650;
}

.empty-subtitle {
    margin-top: 5px;

    font-size: 12px;
}


/* =========================================
   BACKUP
========================================= */

.backup {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 7px;

    margin-top: 16px;
}

.backup-btn {
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    background: #151619;
    color: #d2d3d7;

    border: 1px solid #292a2f;
    border-radius: 11px;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.backup-btn:hover {
    background: #1b1c20;
}

.backup-btn svg {
    width: 17px;
    height: 17px;
}

.backup-btn input {
    display: none;
}


/* =========================================
   LOCAL STORAGE NOTICE
========================================= */

.local-notice {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 17px;

    color: #62646c;

    font-size: 11px;
}

.local-dot {
    width: 7px;
    height: 7px;

    background: var(--green);

    border-radius: 50%;

    box-shadow:
        0 0 8px rgba(34,197,94,.55);
}


/* =========================================
   TOAST
========================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform: translate(-50%, 20px);

    max-width: calc(100% - 30px);

    padding: 10px 14px;

    background: #1b1c20;
    color: #f0f0f2;

    border: 1px solid #303137;
    border-radius: 10px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    font-size: 12px;
    font-weight: 600;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .2s,
        transform .2s;

    z-index: 100;

    text-align: center;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

.toast.error {
    border-color: rgba(239,68,68,.35);
}

.toast.success {
    border-color: rgba(34,197,94,.35);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .app {
        width: calc(100% - 18px);

        padding-top: 22px;
        padding-bottom: 22px;
    }

    .header {
        margin-bottom: 18px;
    }

    .logo {
        width: 52px;
        height: 52px;

        margin-bottom: 13px;

        border-radius: 16px;
    }

    .logo svg {
        width: 25px;
        height: 25px;
    }

    .header h1 {
        font-size: 25px;
    }

    .header p {
        font-size: 13px;
        line-height: 1.4;
    }

    .add-box {
        padding: 9px;
        margin-bottom: 13px;
    }

    .password-input {
        height: 47px;
        font-size: 14px;
    }

    .add-button {
        height: 47px;
        margin-top: 7px;
    }

    .stats {
        gap: 6px;
        margin-bottom: 14px;
    }

    .stat {
        padding: 11px 5px;
        border-radius: 13px;
    }

    .stat-value {
        font-size: 21px;
    }

    .stat-label {
        font-size: 9px;
        margin-top: 5px;
    }

    .search-input {
        height: 44px;
    }

    .filters {
        margin-bottom: 9px;
    }

    .filter-btn {
        padding: 6px 12px;
        font-size: 12px;
    }

    #list {
        gap: 7px;
    }

    .item {
        padding: 9px 9px 9px 11px;
        border-radius: 13px;
    }

    .icon-btn {
        width: 31px;
        height: 31px;
    }

    .icon-btn svg {
        width: 16px;
        height: 16px;
    }

    .password-text {
        margin-top: 8px;
        font-size: 15px;
    }

    .item-bottom {
        margin-top: 7px;
    }

    .backup {
        margin-top: 14px;
    }

    .backup-btn {
        height: 42px;
        font-size: 11px;
    }

    .local-notice {
        margin-top: 14px;
        font-size: 10px;
    }
}


/* =========================================
   VERY SMALL PHONES
========================================= */

@media (max-width: 380px) {

    .app {
        width: calc(100% - 14px);
    }

    .header h1 {
        font-size: 23px;
    }

    .header p {
        font-size: 12px;
    }

    .icon-btn {
        width: 29px;
        height: 29px;
    }

    .icon-btn svg {
        width: 15px;
        height: 15px;
    }

    .password-text {
        font-size: 14px;
    }

    .status {
        padding: 3px 8px;
        font-size: 9px;
    }

    .date {
        font-size: 9px;
    }
}
</style>
</head>


<body>

<div class="app">

    <!-- =================================
         HEADER
    ================================== -->

    <header class="header">

        <div class="logo">

    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <circle cx="8" cy="15" r="4"></circle>
        <path d="M11 12l9-9"></path>
        <path d="M17 5l2 2"></path>
        <path d="M15 7l2 2"></path>
    </svg>

</div>

        <h1>Password Recovery Tracker</h1>

        <p>
            Keep track of password combinations you've tried.
            Copy, test, and mark each attempt.
        </p>

    </header>


    <!-- =================================
         ADD PASSWORD
    ================================== -->

    <section class="add-box">

        <input
            id="pwInput"
            class="password-input"
            type="text"
            autocomplete="off"
            placeholder="Enter password combination..."
            aria-label="Password combination"
        >

        <button
            id="addButton"
            class="add-button"
            type="button"
        >

            <!-- Plus -->
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
            >
                <path d="M12 5v14"></path>
                <path d="M5 12h14"></path>
            </svg>

            Add

        </button>

    </section>


    <!-- =================================
         STATS
    ================================== -->

    <section class="stats">

        <div class="stat">
            <span
                id="totalCount"
                class="stat-value"
            >0</span>

            <span class="stat-label">
                TOTAL
            </span>
        </div>


        <div class="stat">
            <span
                id="triedCount"
                class="stat-value"
            >0</span>

            <span class="stat-label">
                TRIED
            </span>
        </div>


        <div class="stat">
            <span
                id="successCount"
                class="stat-value"
            >0</span>

            <span class="stat-label">
                SUCCESS
            </span>
        </div>

    </section>


    <!-- =================================
         SEARCH
    ================================== -->

    <div class="search-box">

        <!-- Search -->
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        >
            <circle
                cx="11"
                cy="11"
                r="7"
            ></circle>

            <path d="M20 20l-4-4"></path>
        </svg>


        <input
            id="searchInput"
            class="search-input"
            type="text"
            autocomplete="off"
            placeholder="Search attempts..."
        >

    </div>


    <!-- =================================
         FILTERS
    ================================== -->

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
            type="button"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-filter="pending"
            type="button"
        >
            Pending
        </button>

        <button
            class="filter-btn"
            data-filter="failed"
            type="button"
        >
            Failed
        </button>

        <button
            class="filter-btn"
            data-filter="success"
            type="button"
        >
            Success
        </button>

    </div>


    <!-- =================================
         PASSWORD LIST
    ================================== -->

    <div id="list"></div>


    <!-- =================================
         BACKUP
    ================================== -->

    <section class="backup">

        <button
            id="exportButton"
            class="backup-btn"
            type="button"
        >

            <!-- Download -->
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 3v12"></path>
                <path d="M7 10l5 5 5-5"></path>
                <path d="M4 21h16"></path>
            </svg>

            Export Backup

        </button>


        <label class="backup-btn">

            <!-- Upload -->
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 16V4"></path>
                <path d="M7 9l5-5 5 5"></path>
                <path d="M4 20h16"></path>
            </svg>

            Import Backup

            <input
                id="importInput"
                type="file"
                accept=".json,application/json"
            >

        </label>

    </section>


    <!-- =================================
         LOCAL STORAGE
    ================================== -->

    <div class="local-notice">

        <span class="local-dot"></span>

        <span>
            Saved locally in this browser
        </span>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<script>
"use strict";


/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY =
    "get_back_my_key_attempts_v1";


/* =========================================
   STATE
========================================= */

let passwords = [];

let currentFilter = "all";

let searchQuery = "";


/* =========================================
   DOM
========================================= */

const pwInput =
    document.getElementById("pwInput");

const addButton =
    document.getElementById("addButton");

const list =
    document.getElementById("list");

const totalCount =
    document.getElementById("totalCount");

const triedCount =
    document.getElementById("triedCount");

const successCount =
    document.getElementById("successCount");

const searchInput =
    document.getElementById("searchInput");

const toast =
    document.getElementById("toast");

const exportButton =
    document.getElementById("exportButton");

const importInput =
    document.getElementById("importInput");


/* =========================================
   LOAD LOCAL DATA
========================================= */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);


        if (!saved) {

            passwords = [];

            return;
        }


        const parsed =
            JSON.parse(saved);


        if (Array.isArray(parsed)) {

            passwords = parsed;

        } else {

            passwords = [];
        }


    } catch (error) {

        console.error(
            "Failed to load data:",
            error
        );

        passwords = [];
    }
}


/* =========================================
   SAVE LOCAL DATA
========================================= */

function saveData() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(passwords)
        );

    } catch (error) {

        console.error(
            "Failed to save data:",
            error
        );

        showToast(
            "Could not save data locally.",
            "error"
        );
    }
}


/* =========================================
   CREATE UNIQUE ID
========================================= */

function createId() {

    if (
        window.crypto &&
        typeof crypto.randomUUID === "function"
    ) {

        return crypto.randomUUID();
    }


    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* =========================================
   TOAST
========================================= */

let toastTimer = null;


function showToast(
    message,
    type = ""
) {

    clearTimeout(toastTimer);


    toast.textContent = message;


    toast.className = "toast";


    if (type) {

        toast.classList.add(type);
    }


    requestAnimationFrame(() => {

        toast.classList.add("show");

    });


    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 2200);
}


/* =========================================
   ADD PASSWORD
========================================= */

function addPassword() {

    /*
     * IMPORTANT:
     *
     * value itself is NOT trimmed.
     *
     * trim() is used ONLY to check
     * whether the input is empty.
     *
     * So user input remains EXACTLY
     * as entered.
     */

    const value =
        pwInput.value;


    if (!value.trim()) {

        showToast(
            "Please enter a password combination.",
            "error"
        );

        pwInput.focus();

        return;
    }


    /*
     * Exact duplicate check.
     *
     * Case-sensitive.
     * Space-sensitive.
     *
     * "Password"
     * "password"
     * "Password "
     *
     * are all different.
     */

    const existingIndex =
        passwords.findIndex(
            item =>
                item.text === value
        );


    if (existingIndex !== -1) {

        const attemptNumber =
            existingIndex + 1;


        showToast(
            `This combination already exists as attempt #${attemptNumber}.`,
            "error"
        );


        pwInput.select();

        return;
    }


    /*
     * unshift()
     *
     * New password always goes
     * to the TOP of the list.
     */

    passwords.unshift({

        id: createId(),

        text: value,

        status: "pending",

        createdAt:
            new Date().toISOString()

    });


    saveData();


    pwInput.value = "";


    render();


    showToast(
        "Password combination added.",
        "success"
    );


    pwInput.focus();
}


/* =========================================
   MARK STATUS
========================================= */

function markStatus(
    index,
    status
) {

    const item =
        passwords[index];


    if (!item) {
        return;
    }


    /*
     * Clicking active status again
     * changes it back to pending.
     */

    if (item.status === status) {

        item.status = "pending";

    } else {

        item.status = status;
    }


    saveData();

    render();
}


/* =========================================
   DELETE
========================================= */

function deleteItem(index) {

    const item =
        passwords[index];


    if (!item) {
        return;
    }


    const confirmed =
        confirm(
            "Delete this password attempt?"
        );


    if (!confirmed) {
        return;
    }


    passwords.splice(
        index,
        1
    );


    saveData();

    render();


    showToast(
        "Attempt deleted.",
        "success"
    );
}


/* =========================================
   COPY PASSWORD
========================================= */

async function copyText(text) {

    try {

        /*
         * Primary method.
         */

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

        } else {

            fallbackCopy(text);
        }


        showToast(
            "Password copied to clipboard.",
            "success"
        );


    } catch (error) {

        console.error(
            "Copy failed:",
            error
        );


        try {

            fallbackCopy(text);


            showToast(
                "Password copied to clipboard.",
                "success"
            );


        } catch (fallbackError) {

            console.error(
                "Fallback copy failed:",
                fallbackError
            );


            showToast(
                "Could not copy password.",
                "error"
            );
        }
    }
}


/* =========================================
   COPY FALLBACK
========================================= */

function fallbackCopy(text) {

    const textarea =
        document.createElement("textarea");


    textarea.value = text;


    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.style.top =
        "0";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    const successful =
        document.execCommand("copy");


    textarea.remove();


    if (!successful) {

        throw new Error(
            "Fallback copy failed."
        );
    }
}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(

        searchQuery =

        render();

/* =========================================
   FILTER
========================================= */

document
    .querySelectorAll(".filter-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                currentFilter =
                    this.dataset.filter;


                document
                    .querySelectorAll(".filter-btn")
                    .forEach(btn => {

                        btn.classList.toggle(
                            "active",
                            btn.dataset.filter ===
                                currentFilter
                        );

                    });


                render();
            }
        );

    });


/* =========================================
   GET VISIBLE ITEMS
========================================= */

function getVisibleItems() {

    return passwords.filter(
        item => {

            const matchesSearch =
                item.text
                    .toLowerCase()
                    .includes(
                        searchQuery.toLowerCase()
                    );


            let matchesFilter = true;


            if (
                currentFilter ===
                "pending"
            ) {

                matchesFilter =
                    item.status ===
                    "pending";
            }


            if (
                currentFilter ===
                "failed"
            ) {

                matchesFilter =
                    item.status ===
                    "no";
            }


            if (
                currentFilter ===
                "success"
            ) {

                matchesFilter =
                    item.status ===
                    "yes";
            }


            return (
                matchesSearch &&
                matchesFilter
            );
        }
    );
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

/* =========================================
   RENDER
========================================= */

function render() {

    updateStats();


    const visibleItems =
        getVisibleItems();


    list.innerHTML = "";


    if (
        visibleItems.length === 0
    ) {

        const noData =
            passwords.length === 0;


        list.innerHTML = `

            <div class="empty">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="8"
                    ></circle>

                    <path
                        d="M8 12h8"
                    ></path>

                </svg>


                <div class="empty-title">

                    ${
                        noData
                            ? "No password attempts yet."
                            : "No matching attempts found."
                    }

                </div>


                <div class="empty-subtitle">

                    ${
                        noData
                            ? "Add your first password combination above."
                            : "Try another search or filter."
                    }

                </div>

            </div>

        `;

        return;
    }


    visibleItems.forEach(item => {

        const originalIndex =
            passwords.indexOf(item);


        const attemptNumber =
            originalIndex + 1;


        const isSuccess =
            item.status === "yes";


        const isFailed =
            item.status === "no";


        const card =
            document.createElement("article");


        card.className =
            "item " +
            (
                isSuccess
                    ? "success"
                    : isFailed
                        ? "failed"
                        : ""
            );


        card.innerHTML = `

            <div class="item-top">

                <span class="attempt-number">
                    #${attemptNumber}
                </span>


                <div class="actions">

                    <button
                        type="button"
                        class="icon-btn"
                        data-action="copy"
                        data-index="${originalIndex}"
                        aria-label="Copy password"
                        title="Copy"
                    >
                        ${icons.copy}
                    </button>


                    <button
                        type="button"
                        class="icon-btn ${
                            isSuccess
                                ? "success-active"
                                : ""
                        }"
                        data-action="success"
                        data-index="${originalIndex}"
                        aria-label="Mark as successful"
                        title="Mark successful"
                    >
                        ${icons.check}
                    </button>


                    <button
                        type="button"
                        class="icon-btn ${
                            isFailed
                                ? "failed-active"
                                : ""
                        }"
                        data-action="failed"
                        data-index="${originalIndex}"
                        aria-label="Mark as failed"
                        title="Mark failed"
                    >
                        ${icons.close}
                    </button>


                    <button
                        type="button"
                        class="icon-btn"
                        data-action="delete"
                        data-index="${originalIndex}"
                        aria-label="Delete attempt"
                        title="Delete"
                    >
                        ${icons.trash}
                    </button>

                </div>

            </div>


            <div class="password-text">
                ${escapeHtml(item.text)}
            </div>


            <div class="item-bottom">

                <span class="status ${
                    isSuccess
                        ? "success"
                        : isFailed
                            ? "failed"
                            : ""
                }">

                    ${
                        isSuccess
                            ? "SUCCESS"
                            : isFailed
                                ? "FAILED"
                                : "PENDING"
                    }

                </span>


                <span class="date">
                    ${formatDate(item.createdAt)}
                </span>

            </div>

        `;


        list.appendChild(card);

    });
}


/* =========================================
   STATS
========================================= */

function updateStats() {

    const total =
        passwords.length;


    const tried =
        passwords.filter(
            item =>
                item.status !==
                "pending"
        ).length;


    const success =
        passwords.filter(
            item =>
                item.status ===
                "yes"
        ).length;


    totalCount.textContent =
        total;


    triedCount.textContent =
        tried;


    successCount.textContent =
        success;
}


/* =========================================
   DATE
========================================= */

function formatDate(
    dateString
) {

    if (!dateString) {
        return "";
    }


    const date =
        new Date(dateString);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================
   CARD ACTIONS
========================================= */

list.addEventListener(
    "click",
    function(event) {

        const button =
            event.target.closest(
                "[data-action]"
            );


        if (!button) {
            return;
        }


        const index =
            Number(
                button.dataset.index
            );


        const action =
            button.dataset.action;


        if (
            !Number.isInteger(index)
        ) {

            return;
        }


        if (action === "copy") {

            const item =
                passwords[index];


            if (item) {

                copyText(
                    item.text
                );
            }

        }


        else if (
            action === "success"
        ) {

            markStatus(
                index,
                "yes"
            );

        }


        else if (
            action === "failed"
        ) {

            markStatus(
                index,
                "no"
            );

        }


        else if (
            action === "delete"
        ) {

            deleteItem(index);

        }

    }
);

/* =========================================
   EXPORT BACKUP
========================================= */

exportButton.addEventListener(
    "click",
    function() {

        if (
            passwords.length === 0
        ) {

            showToast(
                "There is no data to export.",
                "error"
            );

            return;
        }


        const backup = {

            app:
                "Get Back My Key",

            version:
                1,

            exportedAt:
                new Date().toISOString(),

            attempts:
                passwords
        };


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        backup,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href = url;


        link.download =
            `get-back-my-key-backup-${formatFileDate()}.json`;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );


        showToast(
            "Backup exported successfully.",
            "success"
        );

    }
);


/* =========================================
   IMPORT BACKUP
========================================= */

importInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function() {

                try {

                    const data =
                        JSON.parse(
                            reader.result
                        );


                    let importedAttempts =
                        null;


                    /*
                     * Our backup format.
                     */

                    if (
                        data &&
                        Array.isArray(
                            data.attempts
                        )
                    ) {

                        importedAttempts =
                            data.attempts;

                    }


                    /*
                     * Also accept plain arrays.
                     */

                    else if (
                        Array.isArray(data)
                    ) {

                        importedAttempts =
                            data;

                    }


                    if (
                        !importedAttempts
                    ) {

                        throw new Error(
                            "Invalid backup."
                        );
                    }


                    const cleaned =
                        importedAttempts
                            .filter(
                                item =>
                                    item &&
                                    typeof item.text ===
                                        "string"
                            )
                            .map(
                                item => ({

                                    id:
                                        item.id ||
                                        createId(),

                                    text:
                                        item.text,

                                    status:
                                        [
                                            "pending",
                                            "yes",
                                            "no"
                                        ].includes(
                                            item.status
                                        )
                                            ? item.status
                                            : "pending",

                                    createdAt:
                                        item.createdAt ||
                                        new Date()
                                            .toISOString()

                                })
                            );


                    /*
                     * Remove exact duplicates
                     * inside imported backup.
                     */

                    const seen =
                        new Set();


                    const unique =
                        cleaned.filter(
                            item => {

                                if (
                                    seen.has(
                                        item.text
                                    )
                                ) {

                                    return false;
                                }


                                seen.add(
                                    item.text
                                );


                                return true;
                            }
                        );


                    const replace =
                        confirm(
                            `Import ${unique.length} attempts?\n\n` +
                            "OK = Replace current data\n" +
                            "Cancel = Merge with current data"
                        );


                    if (replace) {

                        passwords =
                            unique;

                    } else {

                        const existingTexts =
                            new Set(
                                passwords.map(
                                    item =>
                                        item.text
                                )
                            );


                        const newItems =
                            unique.filter(
                                item =>
                                    !existingTexts.has(
                                        item.text
                                    )
                            );


                        passwords = [
                            ...passwords,
                            ...newItems
                        ];
                    }


                    saveData();

                    render();


                    showToast(
                        "Backup imported successfully.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Import error:",
                        error
                    );


                    showToast(
                        "Invalid backup file.",
                        "error"
                    );
                }


                /*
                 * Allow the same file
                 * to be imported again.
                 */

                importInput.value = "";
            };


        reader.readAsText(file);

    }
);


/* =========================================
   FILE DATE
========================================= */

function formatFileDate() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return `${year}-${month}-${day}`;
}
