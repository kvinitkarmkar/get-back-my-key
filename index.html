<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#08090c">

<meta
    name="description"
    content="Get Back My Key — local password recovery attempt tracker."
>

<link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='16' fill='%23101114'/%3E%3Ccircle cx='23' cy='35' r='10' stroke='%23F5F5F7' stroke-width='5'/%3E%3Cpath d='M30 28L48 10' stroke='%23F5F5F7' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M42 16L48 22' stroke='%23F5F5F7' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M36 22L42 28' stroke='%23F5F5F7' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M17 23A15 15 0 0 1 38 18' stroke='%233B82F6' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M16 17L16 24L23 24' stroke='%233B82F6' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
>

<title>Get Back My Key</title>


<style>

/* =========================================
   BASE
========================================= */

:root {
    --bg: #08090c;
    --surface: #101114;
    --surface-2: #151619;
    --border: #24252a;
    --border-hover: #33343a;

    --text: #f5f5f7;
    --muted: #858790;
    --muted-2: #60626a;

    --blue: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(59,130,246,.07),
            transparent 35%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    user-select: none;
}


/* =========================================
   APP
========================================= */

.app {
    width: min(100% - 18px, 680px);

    margin: 0 auto;

    padding:
        22px
        0
        20px;
}


/* =========================================
   HEADER
========================================= */

.header {
    text-align: center;

    margin-bottom: 16px;
}

.logo {
    width: 48px;
    height: 48px;

    margin: 0 auto 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #141519;

    border: 1px solid #27282d;

    border-radius: 14px;
}

.logo svg {
    width: 27px;
    height: 27px;
}

.header h1 {
    margin: 0;

    font-size: 24px;
    line-height: 1.15;

    font-weight: 750;

    letter-spacing: -.6px;
}

.header p {
    max-width: 470px;

    margin:
        6px auto
        0;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.35;
}


/* =========================================
   ADD AREA
========================================= */

.add-box {
    padding: 8px;

    margin-bottom: 10px;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 12px;
}

.password-input {
    width: 100%;
    height: 43px;

    padding:
        0 11px;

    background: var(--surface-2);

    color: var(--text);

    border:
        1px solid #28292e;

    border-radius: 9px;

    outline: none;

    font-size: 13px;

    transition: .2s;
}

.password-input::placeholder {
    color: #656770;
}

.password-input:focus {
    border-color:
        rgba(59,130,246,.65);

    box-shadow:
        0 0 0 2px
        rgba(59,130,246,.08);
}

.add-button {
    width: 100%;
    height: 42px;

    margin-top: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    border: 0;
    border-radius: 9px;

    background: var(--blue);

    color: white;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;
}

.add-button:active {
    transform: scale(.985);
}

.add-button svg {
    width: 16px;
    height: 16px;
}


/* =========================================
   STATS
========================================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 5px;

    margin-bottom: 9px;
}

.stat {
    padding: 8px 5px;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 10px;

    text-align: center;
}

.stat-value {
    display: block;

    font-size: 18px;

    line-height: 1;

    font-weight: 750;
}

.stat-label {
    display: block;

    margin-top: 4px;

    color: var(--muted);

    font-size: 8px;

    font-weight: 750;

    letter-spacing: .6px;
}


/* =========================================
   SEARCH
========================================= */

.search-box {
    position: relative;

    margin-bottom: 7px;
}

.search-box > svg {
    position: absolute;

    left: 11px;
    top: 50%;

    width: 15px;
    height: 15px;

    transform:
        translateY(-50%);

    color: #6d6f78;

    pointer-events: none;
}

.search-input {
    width: 100%;
    height: 39px;

    padding:
        0 10px
        0 35px;

    background: var(--surface);

    color: var(--text);

    border:
        1px solid var(--border);

    border-radius: 9px;

    outline: none;

    font-size: 12px;
}

.search-input::placeholder {
    color: #62646d;
}

.search-input:focus {
    border-color:
        var(--border-hover);
}


/* =========================================
   FILTERS
========================================= */

.filters {
    display: flex;

    gap: 3px;

    overflow-x: auto;

    margin-bottom: 7px;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter-btn {
    flex: 0 0 auto;

    padding:
        5px 10px;

    background: transparent;

    color: var(--muted);

    border:
        1px solid transparent;

    border-radius: 99px;

    font-size: 11px;

    font-weight: 650;

    cursor: pointer;
}

.filter-btn.active {
    background: #18191d;

    color: #ededf0;

    border-color:
        #292a2f;
}


/* =========================================
   LIST
========================================= */

#list {
    display: flex;

    flex-direction: column;

    gap: 5px;
}


/* =========================================
   COMPACT CARD
========================================= */

.item {
    min-width: 0;

    padding:
        6px
        7px
        6px
        9px;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-left:
        2px solid #3d3e44;

    border-radius: 9px;

    transition:
        border-color .15s;
}

.item.success {
    border-left-color:
        var(--green);
}

.item.failed {
    border-left-color:
        var(--red);
}


/* =========================================
   CARD MAIN ROW
========================================= */

.card-row {
    display: flex;

    align-items: center;

    gap: 7px;

    min-width: 0;
}


/* =========================================
   ATTEMPT
========================================= */

.attempt-number {
    flex: 0 0 auto;

    min-width: 22px;

    color: #656770;

    font-size: 9px;

    font-weight: 750;
}


/* =========================================
   PASSWORD
========================================= */

.password-text {
    flex: 1;

    min-width: 0;

    color: #eeeeF1;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;

    font-size: 12px;

    line-height: 1.25;

    word-break: break-word;

    overflow-wrap: anywhere;

    white-space: pre-wrap;
}


/* =========================================
   ACTIONS
========================================= */

.actions {
    flex: 0 0 auto;

    display: flex;

    gap: 2px;
}

.icon-btn {
    width: 26px;
    height: 26px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--surface-2);

    color: #777982;

    border:
        1px solid #292a2f;

    border-radius: 7px;

    cursor: pointer;

    transition:
        background .12s,
        color .12s,
        transform .1s;
}

.icon-btn:active {
    transform: scale(.91);
}

.icon-btn:hover {
    background: #1d1e22;

    color: #e3e4e7;
}

.icon-btn svg {
    width: 13px;
    height: 13px;

    stroke-width: 1.8;
}

.icon-btn.success-active {
    color: #86efac;

    background:
        rgba(34,197,94,.09);

    border-color:
        rgba(34,197,94,.28);
}

.icon-btn.failed-active {
    color: #fca5a5;

    background:
        rgba(239,68,68,.09);

    border-color:
        rgba(239,68,68,.28);
}


/* =========================================
   CARD META
========================================= */

.item-meta {
    display: flex;

    align-items: center;

    gap: 7px;

    margin:
        3px 0
        0
        29px;
}

.status {
    display: inline-flex;

    align-items: center;

    padding:
        2px 6px;

    background: #202126;

    color: #8f9199;

    border-radius: 99px;

    font-size: 7px;

    font-weight: 800;

    letter-spacing: .4px;
}

.status.success {
    background:
        rgba(34,197,94,.11);

    color: #86efac;
}

.status.failed {
    background:
        rgba(239,68,68,.11);

    color: #fca5a5;
}

.date {
    color: #55575f;

    font-size: 8px;
}


/* =========================================
   EMPTY
========================================= */

.empty {
    padding:
        28px 14px;

    text-align: center;

    border:
        1px dashed #292a2f;

    border-radius: 10px;

    color: var(--muted-2);
}

.empty svg {
    width: 24px;
    height: 24px;

    margin-bottom: 6px;
}

.empty-title {
    color: #888a92;

    font-size: 12px;

    font-weight: 650;
}

.empty-subtitle {
    margin-top: 3px;

    font-size: 10px;
}


/* =========================================
   BACKUP
========================================= */

.backup {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 5px;

    margin-top: 9px;
}

.backup-btn {
    height: 36px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 6px;

    background: var(--surface);

    color: #aaaab1;

    border:
        1px solid var(--border);

    border-radius: 8px;

    font-size: 10px;

    font-weight: 650;

    cursor: pointer;
}

.backup-btn:hover {
    background: #15161a;
}

.backup-btn svg {
    width: 14px;
    height: 14px;
}

.backup-btn input {
    display: none;
}


/* =========================================
   LOCAL STORAGE
========================================= */

.local-notice {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 5px;

    margin-top: 9px;

    color: #55575f;

    font-size: 9px;
}

.local-dot {
    width: 5px;
    height: 5px;

    background: var(--green);

    border-radius: 50%;

    box-shadow:
        0 0 6px
        rgba(34,197,94,.5);
}


/* =========================================
   TOAST
========================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 15px;

    max-width:
        calc(100% - 24px);

    padding:
        8px 11px;

    transform:
        translate(-50%, 15px);

    background: #191a1e;

    color: #ededf0;

    border:
        1px solid #303137;

    border-radius: 8px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.4);

    font-size: 10px;

    font-weight: 600;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .18s,
        transform .18s;

    z-index: 100;

    text-align: center;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

.toast.error {
    border-color:
        rgba(239,68,68,.35);
}

.toast.success {
    border-color:
        rgba(34,197,94,.35);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .app {
        width:
            calc(100% - 12px);

        padding:
            16px
            0
            15px;
    }

    .header {
        margin-bottom: 12px;
    }

    .logo {
        width: 43px;
        height: 43px;

        margin-bottom: 8px;

        border-radius: 12px;
    }

    .logo svg {
        width: 24px;
        height: 24px;
    }

    .header h1 {
        font-size: 21px;
    }

    .header p {
        font-size: 10px;

        max-width: 340px;
    }

    .add-box {
        padding: 6px;

        border-radius: 10px;
    }

    .password-input {
        height: 39px;

        font-size: 12px;

        border-radius: 8px;
    }

    .add-button {
        height: 38px;

        margin-top: 5px;

        border-radius: 8px;

        font-size: 12px;
    }

    .stats {
        gap: 4px;

        margin-bottom: 7px;
    }

    .stat {
        padding: 7px 3px;

        border-radius: 8px;
    }

    .stat-value {
        font-size: 16px;
    }

    .stat-label {
        font-size: 7px;

        margin-top: 3px;
    }

    .search-input {
        height: 36px;

        font-size: 11px;
    }

    .search-box > svg {
        left: 10px;

        width: 14px;
        height: 14px;
    }

    .search-input {
        padding-left: 32px;
    }

    .filter-btn {
        padding:
            4px 9px;

        font-size: 10px;
    }

    #list {
        gap: 4px;
    }

    .item {
        padding:
            5px
            6px
            5px
            7px;

        border-radius: 8px;
    }

    .card-row {
        gap: 5px;
    }

    .attempt-number {
        min-width: 18px;

        font-size: 8px;
    }

    .password-text {
        font-size: 11px;
    }

    .actions {
        gap: 2px;
    }

    .icon-btn {
        width: 24px;
        height: 24px;

        border-radius: 6px;
    }

    .icon-btn svg {
        width: 12px;
        height: 12px;
    }

    .item-meta {
        margin-top: 2px;
        margin-left: 23px;
    }

    .status {
        padding:
            2px 5px;

        font-size: 6px;
    }

    .date {
        font-size: 7px;
    }

    .backup {
        margin-top: 8px;
    }

    .backup-btn {
        height: 34px;

        font-size: 9px;
    }

    .local-notice {
        margin-top: 8px;

        font-size: 8px;
    }
}


/* =========================================
   EXTRA SMALL DEVICES
========================================= */

@media (max-width: 360px) {

    .app {
        width:
            calc(100% - 8px);
    }

    .password-text {
        font-size: 10px;
    }

    .icon-btn {
        width: 22px;
        height: 22px;
    }

    .icon-btn svg {
        width: 11px;
        height: 11px;
    }

    .attempt-number {
        min-width: 16px;
    }
}

</style>
</head>


<body>


<div class="app">


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="logo">

        <svg
            viewBox="0 0 64 64"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
        >

            <!-- Key -->

            <circle
                cx="23"
                cy="35"
                r="10"
                stroke="#F5F5F7"
                stroke-width="5"
            />

            <path
                d="M30 28L48 10"
                stroke="#F5F5F7"
                stroke-width="5"
                stroke-linecap="round"
            />

            <path
                d="M42 16L48 22"
                stroke="#F5F5F7"
                stroke-width="5"
                stroke-linecap="round"
            />

            <path
                d="M36 22L42 28"
                stroke="#F5F5F7"
                stroke-width="5"
                stroke-linecap="round"
            />

            <!-- Recovery -->

            <path
                d="M17 23A15 15 0 0 1 38 18"
                stroke="#3B82F6"
                stroke-width="4"
                stroke-linecap="round"
            />

            <path
                d="M16 17L16 24L23 24"
                stroke="#3B82F6"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

        </svg>

    </div>


    <h1>
        Get Back My Key
    </h1>


    <p>
        Track password combinations locally.
        Copy, test and mark each attempt.
    </p>

</header>


<!-- =========================================
     ADD
========================================= -->

<section class="add-box">

    <input
        id="pwInput"
        class="password-input"
        type="text"
        autocomplete="off"
        placeholder="Enter password combination..."
        aria-label="Password combination"
    >


    <button
        id="addButton"
        class="add-button"
        type="button"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        >

            <path d="M12 5v14"/>
            <path d="M5 12h14"/>

        </svg>

        Add

    </button>

</section>


<!-- =========================================
     STATS
========================================= -->

<section class="stats">

    <div class="stat">

        <span
            id="totalCount"
            class="stat-value"
        >
            0
        </span>

        <span class="stat-label">
            TOTAL
        </span>

    </div>


    <div class="stat">

        <span
            id="triedCount"
            class="stat-value"
        >
            0
        </span>

        <span class="stat-label">
            TRIED
        </span>

    </div>


    <div class="stat">

        <span
            id="successCount"
            class="stat-value"
        >
            0
        </span>

        <span class="stat-label">
            SUCCESS
        </span>

    </div>

</section>


<!-- =========================================
     SEARCH
========================================= -->

<div class="search-box">

    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
    >

        <circle
            cx="11"
            cy="11"
            r="7"
        />

        <path
            d="M20 20l-4-4"
        />

    </svg>


    <input
        id="searchInput"
        class="search-input"
        type="text"
        autocomplete="off"
        placeholder="Search attempts..."
    >

</div>


<!-- =========================================
     FILTERS
========================================= -->

<div class="filters">

    <button
        class="filter-btn active"
        data-filter="all"
        type="button"
    >
        All
    </button>

    <button
        class="filter-btn"
        data-filter="pending"
        type="button"
    >
        Pending
    </button>

    <button
        class="filter-btn"
        data-filter="failed"
        type="button"
    >
        Failed
    </button>

    <button
        class="filter-btn"
        data-filter="success"
        type="button"
    >
        Success
    </button>

</div>


<!-- =========================================
     LIST
========================================= -->

<div id="list"></div>


<!-- =========================================
     BACKUP
========================================= -->

<section class="backup">

    <button
        id="exportButton"
        class="backup-btn"
        type="button"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >

            <path d="M12 3v12"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M4 21h16"/>

        </svg>

        Export Backup

    </button>


    <label class="backup-btn">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        >

            <path d="M12 16V4"/>
            <path d="M7 9l5-5 5 5"/>
            <path d="M4 20h16"/>

        </svg>

        Import Backup

        <input
            id="importInput"
            type="file"
            accept=".json,application/json"
        >

    </label>

</section>


<!-- =========================================
     LOCAL STORAGE
========================================= -->

<div class="local-notice">

    <span class="local-dot"></span>

    Saved locally in this browser

</div>


</div>


<!-- =========================================
     TOAST
========================================= -->

<div
    id="toast"
    class="toast"
></div>


<script>

"use strict";


/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY =
    "get_back_my_key_attempts_v1";


/* =========================================
   STATE
========================================= */

let passwords = [];

let currentFilter = "all";

let searchQuery = "";


/* =========================================
   DOM
========================================= */

const pwInput =
    document.getElementById("pwInput");

const addButton =
    document.getElementById("addButton");

const list =
    document.getElementById("list");

const totalCount =
    document.getElementById("totalCount");

const triedCount =
    document.getElementById("triedCount");

const successCount =
    document.getElementById("successCount");

const searchInput =
    document.getElementById("searchInput");

const toast =
    document.getElementById("toast");

const exportButton =
    document.getElementById("exportButton");

const importInput =
    document.getElementById("importInput");


/* =========================================
   LOAD
========================================= */

function loadData() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {

            passwords = [];

            return;
        }

        const parsed =
            JSON.parse(saved);

        passwords =
            Array.isArray(parsed)
                ? parsed
                : [];

    } catch (error) {

        console.error(
            "Load error:",
            error
        );

        passwords = [];
    }
}


/* =========================================
   SAVE
========================================= */

function saveData() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(passwords)
        );

    } catch (error) {

        console.error(
            "Save error:",
            error
        );

        showToast(
            "Could not save data locally.",
            "error"
        );
    }
}


/* =========================================
   ID
========================================= */

function createId() {

    if (
        window.crypto &&
        typeof crypto.randomUUID ===
            "function"
    ) {

        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* =========================================
   TOAST
========================================= */

let toastTimer = null;

function showToast(
    message,
    type = ""
) {

    clearTimeout(
        toastTimer
    );

    toast.textContent =
        message;

    toast.className =
        "toast";

    if (type) {

        toast.classList.add(
            type
        );
    }

    requestAnimationFrame(
        () => {

            toast.classList.add(
                "show"
            );

        }
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}


/* =========================================
   ADD
========================================= */

function addPassword() {

    /*
     * Do NOT trim the actual value.
     *
     * This means spaces and case
     * remain exactly as entered.
     */

    const value =
        pwInput.value;


    if (!value.trim()) {

        showToast(
            "Please enter a password combination.",
            "error"
        );

        pwInput.focus();

        return;
    }


    /*
     * Exact duplicate check.
     *
     * Case-sensitive.
     * Space-sensitive.
     */

    const existingIndex =
        passwords.findIndex(
            item =>
                item.text === value
        );


    if (
        existingIndex !== -1
    ) {

        showToast(
            `This combination already exists as attempt #${existingIndex + 1}.`,
            "error"
        );

        pwInput.select();

        return;
    }


    /*
     * unshift = new item at TOP.
     */

    passwords.unshift({

        id:
            createId(),

        text:
            value,

        status:
            "pending",

        createdAt:
            new Date().toISOString()

    });


    saveData();

    pwInput.value = "";

    render();

    showToast(
        "Password combination added.",
        "success"
    );

    pwInput.focus();
}


/* =========================================
   STATUS
========================================= */

function markStatus(
    index,
    status
) {

    const item =
        passwords[index];


    if (!item) {

        return;
    }


    item.status =
        item.status === status
            ? "pending"
            : status;


    saveData();

    render();
}


/* =========================================
   DELETE
========================================= */

function deleteItem(
    index
) {

    const item =
        passwords[index];


    if (!item) {

        return;
    }


    if (
        !confirm(
            "Delete this password attempt?"
        )
    ) {

        return;
    }


    passwords.splice(
        index,
        1
    );


    saveData();

    render();

    showToast(
        "Attempt deleted.",
        "success"
    );
}


/* =========================================
   COPY
========================================= */

async function copyText(
    text
) {

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

        } else {

            fallbackCopy(text);
        }

        showToast(
            "Password copied to clipboard.",
            "success"
        );

    } catch (error) {

        try {

            fallbackCopy(text);

            showToast(
                "Password copied to clipboard.",
                "success"
            );

        } catch (fallbackError) {

            console.error(
                fallbackError
            );

            showToast(
                "Could not copy password.",
                "error"
            );
        }
    }
}


/* =========================================
   COPY FALLBACK
========================================= */

function fallbackCopy(
    text
) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.style.top =
        "0";

    textarea.style.opacity =
        "0";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();

    textarea.setSelectionRange(
        0,
        textarea.value.length
    );


    const successful =
        document.execCommand(
            "copy"
        );


    textarea.remove();


    if (!successful) {

        throw new Error(
            "Copy failed"
        );
    }
}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(

        render();

/* =========================================
   FILTER
========================================= */

document
    .querySelectorAll(
        ".filter-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    currentFilter =
                        this.dataset.filter;


                    document
                        .querySelectorAll(
                            ".filter-btn"
                        )
                        .forEach(
                            btn => {

                                btn.classList.toggle(

                                    btn.dataset.filter ===
                                        currentFilter
                                );

                            }
                        );


                    render();
                }
            );

        }
    );


/* =========================================
   VISIBLE ITEMS
========================================= */

function getVisibleItems() {

    return passwords.filter(
        item => {

            const matchesSearch =
                item.text
                    .toLowerCase()
                    .includes(
                        searchQuery.toLowerCase()
                    );


            let matchesFilter =
                true;


            if (
                currentFilter ===
                "pending"
            ) {

                matchesFilter =
                    item.status ===
                    "pending";
            }


            if (
                currentFilter ===
                "failed"
            ) {

                matchesFilter =
                    item.status ===
                    "no";
            }


            if (
                currentFilter ===
                "success"
            ) {

                matchesFilter =
                    item.status ===
                    "yes";
            }


            return (
                matchesSearch &&
                matchesFilter
            );
        }
    );
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

/* =========================================
   RENDER
========================================= */

function render() {

    updateStats();


    const visibleItems =
        getVisibleItems();


    list.innerHTML = "";


    if (
        visibleItems.length === 0
    ) {

        const noData =
            passwords.length === 0;


        list.innerHTML = `

            <div class="empty">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="8"
                    />

                    <path
                        d="M8 12h8"
                    />

                </svg>


                <div class="empty-title">

                    ${
                        noData
                            ? "No password attempts yet."
                            : "No matching attempts found."
                    }

                </div>


                <div class="empty-subtitle">

                    ${
                        noData
                            ? "Add your first combination above."
                            : "Try another search or filter."
                    }

                </div>

            </div>

        `;


        return;
    }


    visibleItems.forEach(
        item => {

            const originalIndex =
                passwords.indexOf(
                    item
                );


            const attemptNumber =
                originalIndex + 1;


            const success =
                item.status === "yes";


            const failed =
                item.status === "no";


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "item " +
                (
                    success
                        ? "success"
                        : failed
                            ? "failed"
                            : ""
                );


            card.innerHTML = `

                <div class="card-row">


                    <span class="attempt-number">
                        #${attemptNumber}
                    </span>


                    <div class="password-text">
                        ${escapeHtml(item.text)}
                    </div>


                    <div class="actions">


                        <!-- Copy -->

                        <button
                            type="button"
                            class="icon-btn"
                            data-action="copy"
                            data-index="${originalIndex}"
                            aria-label="Copy password"
                            title="Copy"
                        >

                            ${icons.copy}

                        </button>


                        <!-- Success -->

                        <button
                            type="button"
                            class="icon-btn ${
                                success
                                    ? "success-active"
                                    : ""
                            }"
                            data-action="success"
                            data-index="${originalIndex}"
                            aria-label="Mark successful"
                            title="Success"
                        >

                            ${icons.check}

                        </button>


                        <!-- Failed -->

                        <button
                            type="button"
                            class="icon-btn ${
                                failed
                                    ? "failed-active"
                                    : ""
                            }"
                            data-action="failed"
                            data-index="${originalIndex}"
                            aria-label="Mark failed"
                            title="Failed"
                        >

                            ${icons.close}

                        </button>


                        <!-- Delete -->

                        <button
                            type="button"
                            class="icon-btn"
                            data-action="delete"
                            data-index="${originalIndex}"
                            aria-label="Delete"
                            title="Delete"
                        >

                            ${icons.trash}

                        </button>


                    </div>

                </div>


                <div class="item-meta">


                    <span
                        class="status ${
                            success
                                ? "success"
                                : failed
                                    ? "failed"
                                    : ""
                        }"
                    >

                        ${
                            success
                                ? "SUCCESS"
                                : failed
                                    ? "FAILED"
                                    : "PENDING"
                        }

                    </span>


                    <span class="date">

                        ${formatDate(
                            item.createdAt
                        )}

                    </span>


                </div>

            `;


            list.appendChild(
                card
            );

        }
    );
}


/* =========================================
   STATS
========================================= */

function updateStats() {

    const total =
        passwords.length;


    const tried =
        passwords.filter(
            item =>
                item.status !==
                "pending"
        ).length;


    const success =
        passwords.filter(
            item =>
                item.status ===
                "yes"
        ).length;


    totalCount.textContent =
        total;

    triedCount.textContent =
        tried;

    successCount.textContent =
        success;
}


/* =========================================
   DATE
========================================= */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "";
    }


    const date =
        new Date(
            dateString
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        undefined,
        {
            day: "2-digit",
            month: "short",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================
   ACTION HANDLER
========================================= */

list.addEventListener(
    "click",
    function(event) {

        const button =
            event.target.closest(
                "[data-action]"
            );


        if (!button) {

            return;
        }


        const index =
            Number(
                button.dataset.index
            );


        const action =
            button.dataset.action;


        if (
            !Number.isInteger(index)
        ) {

            return;
        }


        if (
            action === "copy"
        ) {

            const item =
                passwords[index];


            if (item) {

                copyText(
                    item.text
                );
            }

        }

        else if (
            action === "success"
        ) {

            markStatus(
                index,
                "yes"
            );

        }

        else if (
            action === "failed"
        ) {

            markStatus(
                index,
                "no"
            );

        }

        else if (
            action === "delete"
        ) {

            deleteItem(
                index
            );
        }

    }
);

/* =========================================
   EXPORT
========================================= */

exportButton.addEventListener(
    "click",
    function() {

        if (
            passwords.length === 0
        ) {

            showToast(
                "There is no data to export.",
                "error"
            );

            return;
        }


        const backup = {

            app:
                "Get Back My Key",

            version:
                1,

            exportedAt:
                new Date().toISOString(),

            attempts:
                passwords
        };


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        backup,
                        null,
                        2
                    )
                ],
                {
                    type:
                        "application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            `get-back-my-key-backup-${formatFileDate()}.json`;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );


        showToast(
            "Backup exported successfully.",
            "success"
        );

    }
);


/* =========================================
   IMPORT
========================================= */

importInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function() {

                try {

                    const data =
                        JSON.parse(
                            reader.result
                        );


                    let imported =
                        null;


                    if (
                        data &&
                        Array.isArray(
                            data.attempts
                        )
                    ) {

                        imported =
                            data.attempts;

                    } else if (
                        Array.isArray(
                            data
                        )
                    ) {

                        imported =
                            data;
                    }


                    if (!imported) {

                        throw new Error(
                            "Invalid backup"
                        );
                    }


                    const cleaned =
                        imported

                            .filter(
                                item =>
                                    item &&
                                    typeof item.text ===
                                        "string"
                            )

                            .map(
                                item => ({

                                    id:
                                        item.id ||
                                        createId(),

                                    text:
                                        item.text,

                                    status:
                                        [
                                            "pending",
                                            "yes",
                                            "no"
                                        ].includes(
                                            item.status
                                        )
                                            ? item.status
                                            : "pending",

                                    createdAt:
                                        item.createdAt ||
                                        new Date()
                                            .toISOString()

                                })
                            );


                    const seen =
                        new Set();


                    const unique =
                        cleaned.filter(
                            item => {

                                if (
                                    seen.has(
                                        item.text
                                    )
                                ) {

                                    return false;
                                }


                                seen.add(
                                    item.text
                                );


                                return true;
                            }
                        );


                    const replace =
                        confirm(
                            `Import ${unique.length} attempts?\n\n` +
                            "OK = Replace current data\n" +
                            "Cancel = Merge with current data"
                        );


                    if (replace) {

                        passwords =
                            unique;

                    } else {

                        const existing =
                            new Set(
                                passwords.map(
                                    item =>
                                        item.text
                                )
                            );


                        const newItems =
                            unique.filter(
                                item =>
                                    !existing.has(
                                        item.text
                                    )
                            );


                        passwords = [
                            ...passwords,
                            ...newItems
                        ];
                    }


                    saveData();

                    render();


                    showToast(
                        "Backup imported successfully.",
                        "success"
                    );


                } catch (error) {

                    console.error(
                        "Import error:",
                        error
                    );


                    showToast(
                        "Invalid backup file.",
                        "error"
                    );
                }


                importInput.value =
                    "";
            };


        reader.readAsText(
            file
        );

    }
);


/* =========================================
   FILE DATE
========================================= */

function formatFileDate() {

    const now =
        new Date();


    return [

        now.getFullYear(),

        String(
            now.getMonth() + 1
        ).padStart(2, "0"),

        String(
            now.getDate()
        ).padStart(2, "0")

    ].join("-");
}
