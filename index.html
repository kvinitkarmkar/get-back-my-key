<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Get Back My Key - Local password attempt tracker"
  />

  <meta name="theme-color" content="#08090d" />

  <title>Get Back My Key</title>

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2315181f'/%3E%3Cpath d='M37 11a13 13 0 0 0-8.7 22.65L12 50l5 5 4-4 4 4 5-5-4-4 5.2-5.2A13 13 0 1 0 37 11Zm0 7a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z' fill='none' stroke='%23f2f3f5' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='m44 14 7-7M45 21l10-10' stroke='%233b82f6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
  />

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: #08090d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(36, 54, 86, 0.18),
          transparent 38%
        ),
        #08090d;
      color: #f5f5f7;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       APP
    ========================================================= */

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 28px 16px 34px;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #15171c;
      border: 1px solid #292c33;
      border-radius: 21px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .logo svg {
      width: 39px;
      height: 39px;
    }

    .title {
      margin: 0;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.12;
      font-weight: 750;
      letter-spacing: -1.3px;
    }

    .subtitle {
      max-width: 650px;
      margin: 12px auto 0;
      color: #8d8f98;
      font-size: 15px;
      line-height: 1.55;
    }

    /* =========================================================
       ADD BOX
    ========================================================= */

    .add-box {
      padding: 10px;
      margin-bottom: 18px;

      background: #101116;
      border: 1px solid #292b31;
      border-radius: 18px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.015);
    }

    .input-wrap {
      position: relative;
    }

    #passwordInput {
      width: 100%;
      height: 54px;

      padding: 0 16px;

      color: #f4f4f6;
      background: #17181d;

      border: 1px solid #292c33;
      border-radius: 14px;

      outline: none;

      font-size: 16px;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    #passwordInput::placeholder {
      color: #696b75;
    }

    #passwordInput:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.13);
    }

    .add-btn {
      width: 100%;
      height: 52px;

      margin-top: 8px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      border: 0;
      border-radius: 14px;

      background: #3b82f6;
      color: #fff;

      font-size: 16px;
      font-weight: 650;

      transition:
        transform 0.12s ease,
        background 0.15s ease;
    }

    .add-btn:hover {
      background: #3478e5;
    }

    .add-btn:active {
      transform: scale(0.985);
    }

    .add-btn svg {
      width: 21px;
      height: 21px;
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat {
      min-height: 76px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #101116;
      border: 1px solid #292b31;
      border-radius: 15px;
    }

    .stat-number {
      font-size: 25px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .stat-label {
      margin-top: 7px;

      color: #888a94;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-wrap {
      position: relative;
      margin-bottom: 9px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 19px;
      height: 19px;
      transform: translateY(-50%);
      color: #737680;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 50px;

      padding: 0 15px 0 44px;

      color: #f4f4f6;
      background: #101116;

      border: 1px solid #292b31;
      border-radius: 14px;

      outline: none;

      font-size: 15px;

      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    #searchInput::placeholder {
      color: #696b75;
    }

    #searchInput:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }

    /* =========================================================
       FILTERS
    ========================================================= */

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;

      margin-bottom: 12px;
      padding: 2px 0;

      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex: 0 0 auto;

      min-height: 38px;
      padding: 0 17px;

      border: 1px solid transparent;
      border-radius: 999px;

      background: transparent;
      color: #8d8f98;

      font-size: 13px;
      font-weight: 650;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease;
    }

    .filter-btn:hover {
      color: #d9d9de;
    }

    .filter-btn.active {
      background: #191a20;
      border-color: #30323a;
      color: #f3f3f5;
    }

    /* =========================================================
       PASSWORD LIST
    ========================================================= */

    #passwordList {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* =========================================================
       COMPACT PASSWORD CARD
    ========================================================= */

    .password-card {
      position: relative;

      min-height: 82px;

      display: flex;
      align-items: center;

      padding: 12px 10px 12px 14px;

      background: #101116;

      border: 1px solid #292b31;
      border-left: 4px solid #464850;

      border-radius: 16px;

      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .password-card:hover {
      background: #121319;
    }

    .password-card.status-success {
      border-left-color: #35c759;
    }

    .password-card.status-failed {
      border-left-color: #ff453a;
    }

    .password-content {
      min-width: 0;
      flex: 1;
      padding-right: 8px;
    }

    .password-text {
      margin: 0;

      color: #f1f1f3;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 16px;
      line-height: 1.3;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      gap: 7px;

      margin-top: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;

      min-height: 25px;
      padding: 0 10px;

      border-radius: 999px;

      background: #24252a;
      color: #a7a8b0;

      font-size: 10px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0.5px;
    }

    .status-badge.success {
      background: rgba(53, 199, 89, 0.12);
      color: #65d985;
    }

    .status-badge.failed {
      background: rgba(255, 69, 58, 0.12);
      color: #ff7a72;
    }

    /* =========================================================
       ACTION BUTTONS
    ========================================================= */

    .actions {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: #15161b;
      color: #9698a1;

      border: 1px solid #292b31;
      border-radius: 12px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.12s ease;
    }

    .icon-btn:hover {
      background: #1b1c22;
      color: #e5e5e8;
      border-color: #363841;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      pointer-events: none;
    }

    .icon-btn.success-active {
      color: #65d985;
      border-color: rgba(53, 199, 89, 0.28);
      background: rgba(53, 199, 89, 0.08);
    }

    .icon-btn.failed-active {
      color: #ff7a72;
      border-color: rgba(255, 69, 58, 0.28);
      background: rgba(255, 69, 58, 0.08);
    }

    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty-state {
      display: none;

      padding: 38px 16px;

      text-align: center;

      color: #686a73;
    }

    .empty-icon {
      width: 38px;
      height: 38px;
      margin: 0 auto 10px;

      color: #52545d;
    }

    .empty-title {
      margin: 0;

      color: #999ba4;

      font-size: 14px;
      font-weight: 600;
    }

    .empty-description {
      margin: 5px 0 0;

      font-size: 12px;
      line-height: 1.5;
    }

    /* =========================================================
       BACKUP
    ========================================================= */

    .backup {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-top: 12px;
    }

    .backup-btn {
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      background: #101116;
      color: #a7a8b0;

      border: 1px solid #292b31;
      border-radius: 14px;

      font-size: 13px;
      font-weight: 650;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .backup-btn:hover {
      background: #15161b;
      color: #ededf0;
    }

    .backup-btn svg {
      width: 19px;
      height: 19px;
    }

    /* =========================================================
       LOCAL STORAGE NOTE
    ========================================================= */

    .storage-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      margin-top: 16px;

      color: #60626b;

      font-size: 12px;
    }

    .storage-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: #35c759;

      box-shadow: 0 0 8px rgba(53, 199, 89, 0.45);
    }

    /* =========================================================
       TOAST
    ========================================================= */

    .toast-container {
      position: fixed;

      left: 50%;
      bottom: 22px;

      z-index: 1000;

      width: min(calc(100% - 30px), 430px);

      transform: translateX(-50%);

      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 12px 14px;

      background: #191a20;
      color: #ededf0;

      border: 1px solid #33353d;
      border-radius: 13px;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45);

      font-size: 13px;
      font-weight: 550;

      opacity: 0;
      transform: translateY(10px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .toast.success .toast-icon {
      color: #65d985;
    }

    .toast.error .toast-icon {
      color: #ff7a72;
    }

    .toast.info .toast-icon {
      color: #65a1ff;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 600px) {
      .app {
        padding: 22px 8px 28px;
      }

      .header {
        margin-bottom: 20px;
      }

      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 13px;
        border-radius: 19px;
      }

      .logo svg {
        width: 35px;
        height: 35px;
      }

      .title {
        font-size: 29px;
        letter-spacing: -1px;
      }

      .subtitle {
        margin-top: 8px;
        padding: 0 8px;

        font-size: 13px;
        line-height: 1.45;
      }

      .add-box {
        padding: 8px;
        border-radius: 16px;
      }

      #passwordInput {
        height: 52px;
        font-size: 15px;
      }

      .add-btn {
        height: 50px;
      }

      .stat {
        min-height: 72px;
        border-radius: 14px;
      }

      .stat-number {
        font-size: 23px;
      }

      .stat-label {
        font-size: 9px;
      }

      .password-card {
        min-height: 76px;
        padding: 10px 8px 10px 12px;
        border-radius: 15px;
      }

      .password-text {
        font-size: 15px;
      }

      .card-bottom {
        margin-top: 6px;
      }

      .status-badge {
        min-height: 23px;
        padding: 0 9px;
        font-size: 9px;
      }

      .actions {
        gap: 4px;
      }

      .icon-btn {
        width: 39px;
        height: 39px;
        border-radius: 11px;
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
      }

      .backup-btn {
        height: 50px;
        font-size: 12px;
      }
    }

    @media (max-width: 390px) {
      .password-card {
        align-items: center;
      }

      .password-content {
        padding-right: 5px;
      }

      .password-text {
        font-size: 14px;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
      }

      .icon-btn svg {
        width: 17px;
        height: 17px;
      }

      .actions {
        gap: 3px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- =======================================================
         HEADER
    ======================================================== -->

    <header class="header">

      <div class="logo" aria-hidden="true">
        <svg
          viewBox="0 0 64 64"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle
            cx="30"
            cy="34"
            r="11"
            stroke="#F2F3F5"
            stroke-width="4"
          />

          <path
            d="M38 26L53 11"
            stroke="#F2F3F5"
            stroke-width="4"
            stroke-linecap="round"
          />

          <path
            d="M47 17L53 23"
            stroke="#F2F3F5"
            stroke-width="4"
            stroke-linecap="round"
          />

          <path
            d="M42 22L48 28"
            stroke="#3B82F6"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <h1 class="title">Get Back My Key</h1>

      <p class="subtitle">
        Track password combinations locally. Copy, test and mark each attempt.
      </p>

    </header>


    <!-- =======================================================
         ADD PASSWORD
    ======================================================== -->

    <section class="add-box">

      <div class="input-wrap">
        <input
          id="passwordInput"
          type="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Enter password combination..."
          aria-label="Password combination"
        />
      </div>

      <button
        type="button"
        class="add-btn"
        id="addButton"
      >
        <!-- Plus icon -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M12 5V19" />
          <path d="M5 12H19" />
        </svg>

        <span>Add</span>
      </button>

    </section>


    <!-- =======================================================
         STATS
    ======================================================== -->

    <section class="stats">

      <div class="stat">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">Total</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="triedCount">0</div>
        <div class="stat-label">Tried</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="successCount">0</div>
        <div class="stat-label">Success</div>
      </div>

    </section>


    <!-- =======================================================
         SEARCH
    ======================================================== -->

    <div class="search-wrap">

      <!-- Search icon -->
      <svg
        class="search-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20L16.2 16.2" />
      </svg>

      <input
        id="searchInput"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search attempts..."
        aria-label="Search attempts"
      />

    </div>


    <!-- =======================================================
         FILTERS
    ======================================================== -->

    <div class="filters">

      <button
        type="button"
        class="filter-btn active"
        data-filter="all"
      >
        All
      </button>

      <button
        type="button"
        class="filter-btn"
        data-filter="pending"
      >
        Pending
      </button>

      <button
        type="button"
        class="filter-btn"
        data-filter="failed"
      >
        Failed
      </button>

      <button
        type="button"
        class="filter-btn"
        data-filter="success"
      >
        Success
      </button>

    </div>


    <!-- =======================================================
         PASSWORD LIST
    ======================================================== -->

    <section id="passwordList"></section>


    <!-- =======================================================
         EMPTY STATE
    ======================================================== -->

    <section
      class="empty-state"
      id="emptyState"
    >

      <svg
        class="empty-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="7.5" cy="15.5" r="3.5" />
        <path d="M10 13L20 3" />
        <path d="M17 6L20 9" />
        <path d="M14 9L17 12" />
      </svg>

      <p
        class="empty-title"
        id="emptyTitle"
      >
        No password attempts yet
      </p>

      <p
        class="empty-description"
        id="emptyDescription"
      >
        Add your first combination above.
      </p>

    </section>


    <!-- =======================================================
         BACKUP
    ======================================================== -->

    <section class="backup">

      <button
        type="button"
        class="backup-btn"
        id="exportButton"
      >
        <!-- Download icon -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3V15" />
          <path d="M7 10L12 15L17 10" />
          <path d="M5 21H19" />
        </svg>

        <span>Export Backup</span>
      </button>


      <button
        type="button"
        class="backup-btn"
        id="importButton"
      >
        <!-- Upload icon -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 21V9" />
          <path d="M7 14L12 9L17 14" />
          <path d="M5 3H19" />
        </svg>

        <span>Import Backup</span>
      </button>

      <input
        type="file"
        id="importFile"
        accept=".json,application/json"
        hidden
      />

    </section>


    <!-- =======================================================
         STORAGE STATUS
    ======================================================== -->

    <div class="storage-note">

      <span class="storage-dot"></span>

      <span>Saved locally in this browser</span>

    </div>

  </main>


  <!-- =========================================================
       TOAST
  ========================================================== -->

  <div class="toast-container">

    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
    >
      <svg
        class="toast-icon"
        id="toastIcon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></svg>

      <span id="toastMessage"></span>
    </div>

  </div>


  <script>
    "use strict";

    /* =========================================================
       STORAGE
    ========================================================= */

    const STORAGE_KEY = "getBackMyKey_passwords_v1";


    /* =========================================================
       STATE
    ========================================================= */

    let passwords = [];
    let currentFilter = "all";
    let searchQuery = "";


    /* =========================================================
       DOM
    ========================================================= */

    const passwordInput = document.getElementById("passwordInput");
    const addButton = document.getElementById("addButton");

    const passwordList = document.getElementById("passwordList");

    const totalCount = document.getElementById("totalCount");
    const triedCount = document.getElementById("triedCount");
    const successCount = document.getElementById("successCount");

    const searchInput = document.getElementById("searchInput");

    const emptyState = document.getElementById("emptyState");
    const emptyTitle = document.getElementById("emptyTitle");
    const emptyDescription = document.getElementById("emptyDescription");

    const exportButton = document.getElementById("exportButton");
    const importButton = document.getElementById("importButton");
    const importFile = document.getElementById("importFile");

    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toastMessage");
    const toastIcon = document.getElementById("toastIcon");


    /* =========================================================
       SVG ICONS
    ========================================================= */

    const ICONS = {

      copy: `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"

          <rect x="8" y="8" width="11" height="11" rx="2"/>
          <path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4H6.5A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/>
        </svg>
      `,

      check: `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 12.5L10 17L19 7"/>
        </svg>
      `,

      close: `
        <svg
          viewBox="0 0 24 24"

          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M6 6L18 18"/>
          <path d="M18 6L6 18"/>
        </svg>
      `,

      trash: `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"

        >
          <path d="M4 7H20"/>
          <path d="M9 7V4H15V7"/>

        </svg>
      `,

      success: `
        <svg
          viewBox="0 0 24 24"
          fill="none"

          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9"/>
          <path d="M8 12L11 15L16 9"/>
        </svg>
      `,

      error: `
        <svg
          viewBox="0 0 24 24"

        >

            cx="12"

          />

        </svg>
      `,

      info: `
        <svg
          viewBox="0 0 24 24"
          fill="none"

        >

          <path d="M12 8H12.01"/>
        </svg>
      `,

      empty: `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="7.5" cy="15.5" r="3.5"/>
          <path d="M10 13L20 3"/>
          <path d="M17 6L20 9"/>
          <path d="M14 9L17 12"/>
        </svg>
      `
    };


    /* =========================================================
       LOAD DATA
    ========================================================= */

    function loadPasswords() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          passwords = [];
          return;
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
          passwords = [];
          return;
        }

        passwords = parsed
          .filter(item =>
            item &&
            typeof item.text === "string" &&
            typeof item.status === "string"
          )
          .map(item => ({
            id:
              typeof item.id === "string"
                ? item.id
                : createId(),

            text: item.text,

            status:
              ["pending", "success", "failed"].includes(item.status)
                ? item.status
                : "pending",

            createdAt:
              typeof item.createdAt === "number"
                ? item.createdAt
                : Date.now()
          }));

      } catch (error) {
        console.error("Failed to load local data:", error);
        passwords = [];
      }
    }


    /* =========================================================
       SAVE DATA
    ========================================================= */

    function savePasswords() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(passwords)
        );
      } catch (error) {
        console.error("Failed to save local data:", error);

        showToast(
          "Could not save data to this browser.",
          "error"
        );
      }
    }


    /* =========================================================
       CREATE ID
    ========================================================= */

    function createId() {
      if (
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
      ) {
        return crypto.randomUUID();
      }

      return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2)
      );
    }


    /* =========================================================
       ADD PASSWORD
       
       IMPORTANT:
       The password is stored EXACTLY as entered.
       No trim, no lowercase, no modification.
    ========================================================= */

    function addPassword() {

      const value = passwordInput.value;

      /*
        Only an actually empty input is rejected.

        We intentionally DO NOT use trim()
        because the user's password must remain
        exactly as entered, including spaces.
      */

      if (value.length === 0) {
        showToast(
          "Enter a password combination first.",
          "error"
        );

        passwordInput.focus();
        return;
      }


      /*
        Exact duplicate check.

        "Password"
        "password"
        " Password"
        "Password "

        are treated as DIFFERENT entries.

        This preserves the password exactly as entered.
      */

      const duplicateIndex = passwords.findIndex(
        item => item.text === value
      );


      if (duplicateIndex !== -1) {

        /*
          Existing attempt number is based on its
          position in the stored list.

          Since newest entries are at the top,
          position + 1 represents its visible number.
        */

        const attemptNumber = duplicateIndex + 1;

        showToast(
          `This combination already exists as attempt #${attemptNumber}.`,
          "error"
        );

        passwordInput.focus();

        return;
      }


      /*
        unshift() puts the newest password
        at the TOP of the list.
      */

      passwords.unshift({
        id: createId(),
        text: value,
        status: "pending",
        createdAt: Date.now()
      });


      passwordInput.value = "";

      savePasswords();

      currentFilter = "all";
      searchQuery = "";
      searchInput.value = "";

      updateFilterButtons();
      render();

      showToast(
        "Password combination added.",
        "success"
      );
    }


    /* =========================================================
       COPY PASSWORD
    ========================================================= */

    async function copyPassword(id, button) {

      const item = passwords.find(
        password => password.id === id
      );

      if (!item) return;


      try {

        /*
          Modern Clipboard API
        */

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {
          await navigator.clipboard.writeText(item.text);

        } else {

          /*
            Fallback for older/mobile browsers.
          */

          const textarea =
            document.createElement("textarea");

          textarea.value = item.text;

          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          textarea.style.pointerEvents = "none";

          document.body.appendChild(textarea);

          textarea.focus();
          textarea.select();

          const successful =
            document.execCommand("copy");

          textarea.remove();

          if (!successful) {
            throw new Error("Copy failed");
          }
        }


        const oldHTML = button.innerHTML;

        button.innerHTML = ICONS.check;
        button.style.color = "#65d985";
        button.style.borderColor =
          "rgba(53, 199, 89, 0.28)";

        setTimeout(() => {

          if (button.isConnected) {
            button.innerHTML = oldHTML;
            button.style.color = "";
            button.style.borderColor = "";
          }

        }, 1000);


        showToast(
          "Password copied to clipboard.",
          "success"
        );

      } catch (error) {

        console.error("Copy failed:", error);

        showToast(
          "Could not copy this password.",
          "error"
        );
      }
    }


    /* =========================================================
       CHANGE STATUS
    ========================================================= */

    function changeStatus(id, status) {

      const item = passwords.find(
        password => password.id === id
      );

      if (!item) return;


      /*
        Clicking the currently active status
        returns it to pending.
      */

      if (item.status === status) {
        item.status = "pending";

      } else {
        item.status = status;
      }


      savePasswords();
      render();

      if (item.status === "success") {

        showToast(
          "Marked as successful.",
          "success"
        );

      } else if (item.status === "failed") {

        showToast(
          "Marked as failed.",
          "info"
        );

      } else {

        showToast(
          "Reset to pending.",
          "info"
        );
      }
    }


    /* =========================================================
       DELETE
    ========================================================= */

    function deletePassword(id) {

      const index = passwords.findIndex(
        item => item.id === id
      );

      if (index === -1) return;


      const shouldDelete = window.confirm(
        "Delete this password attempt?"
      );

      if (!shouldDelete) return;


      passwords.splice(index, 1);

      savePasswords();
      render();

      showToast(
        "Password attempt deleted.",
        "success"
      );
    }


    /* =========================================================
       FILTER
    ========================================================= */

    function setFilter(filter) {

      currentFilter = filter;

      updateFilterButtons();
      render();
    }


    function updateFilterButtons() {

      document
        .querySelectorAll(".filter-btn")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.filter === currentFilter
          );

        });
    }


    /* =========================================================
       SEARCH
    ========================================================= */

    function setSearch(value) {

      searchQuery = value;

      render();
    }


    /* =========================================================
       GET FILTERED DATA
    ========================================================= */

    function getVisiblePasswords() {

      const query =
        searchQuery.toLocaleLowerCase();

      return passwords.filter(item => {

        const matchesSearch =
          item.text
            .toLocaleLowerCase()
            .includes(query);


        const matchesFilter =
          currentFilter === "all" ||
          item.status === currentFilter;


        return matchesSearch && matchesFilter;
      });
    }


    /* =========================================================
       RENDER
    ========================================================= */

    function render() {

      updateStats();

      passwordList.innerHTML = "";

      const visiblePasswords =
        getVisiblePasswords();


      if (visiblePasswords.length === 0) {

        passwordList.style.display = "none";
        emptyState.style.display = "block";


        if (passwords.length === 0) {

          emptyTitle.textContent =
            "No password attempts yet";

          emptyDescription.textContent =
            "Add your first combination above.";

        } else {

          emptyTitle.textContent =
            "No matching attempts";

          emptyDescription.textContent =
            "Try a different search or filter.";
        }

        return;
      }


      passwordList.style.display = "flex";
      emptyState.style.display = "none";


      visiblePasswords.forEach(item => {

        const card =
          createPasswordCard(item);

        passwordList.appendChild(card);
      });
    }


    /* =========================================================
       CREATE PASSWORD CARD
    ========================================================= */

    function createPasswordCard(item) {

      const card =
        document.createElement("article");

      card.className =
        "password-card";


      if (item.status === "success") {
        card.classList.add("status-success");
      }

      if (item.status === "failed") {
        card.classList.add("status-failed");
      }


      /* -------------------------------------------------------
         CONTENT
      ------------------------------------------------------- */

      const content =
        document.createElement("div");

      content.className =
        "password-content";


      const passwordText =
        document.createElement("p");

      passwordText.className =
        "password-text";

      /*
        textContent is intentionally used here
        so special characters are displayed safely.
      */

      passwordText.textContent =
        item.text;


      /* -------------------------------------------------------
         BOTTOM / STATUS
      ------------------------------------------------------- */

      const bottom =
        document.createElement("div");

      bottom.className =
        "card-bottom";


      const badge =
        document.createElement("span");

      badge.className =
        "status-badge";


      if (item.status === "success") {

        badge.classList.add("success");
        badge.textContent = "SUCCESS";

      } else if (item.status === "failed") {

        badge.classList.add("failed");
        badge.textContent = "FAILED";

      } else {

        badge.textContent = "PENDING";
      }


      bottom.appendChild(badge);

      content.appendChild(passwordText);
      content.appendChild(bottom);


      /* -------------------------------------------------------
         ACTIONS
      ------------------------------------------------------- */

      const actions =
        document.createElement("div");

      actions.className =
        "actions";


      /*
        COPY
      */

      const copyButton =
        document.createElement("button");

      copyButton.type = "button";

      copyButton.className =
        "icon-btn";

      copyButton.innerHTML =
        ICONS.copy;

      copyButton.title =
        "Copy password";

      copyButton.setAttribute(
        "aria-label",
        "Copy password"
      );

      copyButton.addEventListener(
        "click",
        () => copyPassword(item.id, copyButton)
      );


      /*
        SUCCESS
      */

      const successButton =
        document.createElement("button");

      successButton.type = "button";

      successButton.className =
        "icon-btn";

      if (item.status === "success") {
        successButton.classList.add(
          "success-active"
        );
      }

      successButton.innerHTML =
        ICONS.check;

      successButton.title =
        "Mark as success";

      successButton.setAttribute(
        "aria-label",
        "Mark as success"
      );

      successButton.addEventListener(
        "click",
        () => changeStatus(item.id, "success")
      );


      /*
        FAILED
      */

      const failedButton =
        document.createElement("button");

      failedButton.type = "button";

      failedButton.className =
        "icon-btn";

      if (item.status === "failed") {
        failedButton.classList.add(
          "failed-active"
        );
      }

      failedButton.innerHTML =
        ICONS.close;

      failedButton.title =
        "Mark as failed";

      failedButton.setAttribute(
        "aria-label",
        "Mark as failed"
      );

      failedButton.addEventListener(
        "click",
        () => changeStatus(item.id, "failed")
      );


      /*
        DELETE
      */

      const deleteButton =
        document.createElement("button");

      deleteButton.type = "button";

      deleteButton.className =
        "icon-btn";

      deleteButton.innerHTML =
        ICONS.trash;

      deleteButton.title =
        "Delete attempt";

      deleteButton.setAttribute(
        "aria-label",
        "Delete attempt"
      );

      deleteButton.addEventListener(
        "click",
        () => deletePassword(item.id)
      );


      actions.appendChild(copyButton);
      actions.appendChild(successButton);
      actions.appendChild(failedButton);
      actions.appendChild(deleteButton);


      /*
        FINAL CARD
      */

      card.appendChild(content);
      card.appendChild(actions);


      return card;
    }


    /* =========================================================
       UPDATE STATS
    ========================================================= */

    function updateStats() {

      const total =
        passwords.length;

      const tried =
        passwords.filter(
          item => item.status !== "pending"
        ).length;

      const success =
        passwords.filter(
          item => item.status === "success"
        ).length;


      totalCount.textContent =
        total;

      triedCount.textContent =
        tried;

      successCount.textContent =
        success;
    }


    /* =========================================================
       TOAST
    ========================================================= */

    let toastTimer = null;


    function showToast(message, type = "info") {

      clearTimeout(toastTimer);


      toast.className =
        `toast ${type}`;


      toastMessage.textContent =
        message;


      if (type === "success") {
        toastIcon.innerHTML =
          ICONS.success;

      } else if (type === "error") {
        toastIcon.innerHTML =
          ICONS.error;

      } else {
        toastIcon.innerHTML =
          ICONS.info;
      }


      /*
        Force animation restart.
      */

      requestAnimationFrame(() => {

        toast.classList.add("show");

      });


      toastTimer =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 2400);
    }


    /* =========================================================
       EXPORT BACKUP
    ========================================================= */

    function exportBackup() {

      const backup = {
        app: "Get Back My Key",
        version: 1,
        exportedAt: new Date().toISOString(),
        passwords: passwords
      };


      const json =
        JSON.stringify(
          backup,
          null,
          2
        );


      const blob =
        new Blob(
          [json],
          {
            type: "application/json"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        `get-back-my-key-backup-${formatDateForFile()}.json`;


      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(url);


      showToast(
        "Backup exported successfully.",
        "success"
      );
    }


    /* =========================================================
       FORMAT BACKUP FILE DATE
    ========================================================= */

    function formatDateForFile() {

      const now =
        new Date();

      const year =
        now.getFullYear();

      const month =
        String(now.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(now.getDate())
          .padStart(2, "0");

      const hours =
        String(now.getHours())
          .padStart(2, "0");

      const minutes =
        String(now.getMinutes())
          .padStart(2, "0");


      return `${year}-${month}-${day}-${hours}${minutes}`;
    }


    /* =========================================================
       IMPORT BACKUP
    ========================================================= */

    function importBackup() {

      importFile.value = "";

      importFile.click();
    }


    /* =========================================================
       PROCESS IMPORT
    ========================================================= */

    function processImport(file) {

      if (!file) return;


      const reader =
        new FileReader();


      reader.onload = function(event) {

        try {

          const parsed =
            JSON.parse(event.target.result);


          /*
            Support our backup format.
          */

          const imported =
            Array.isArray(parsed)
              ? parsed
              : parsed.passwords;


          if (!Array.isArray(imported)) {
            throw new Error(
              "Invalid backup format"
            );
          }


          const validItems =
            imported
              .filter(item =>
                item &&
                typeof item.text === "string"
              )
              .map(item => ({

                id:
                  typeof item.id === "string"
                    ? item.id
                    : createId(),

                text:
                  item.text,

                status:
                  ["pending", "success", "failed"]
                    .includes(item.status)
                    ? item.status
                    : "pending",

                createdAt:
                  typeof item.createdAt === "number"
                    ? item.createdAt
                    : Date.now()

              }));


          /*
            Remove exact duplicates INSIDE
            the imported backup while preserving
            the first occurrence.
          */

          const uniqueImported = [];

          for (const item of validItems) {

            const exists =
              uniqueImported.some(
                existing =>
                  existing.text === item.text
              );

            if (!exists) {
              uniqueImported.push(item);
            }
          }


          if (uniqueImported.length === 0) {

            showToast(
              "No valid password attempts found in backup.",
              "error"
            );

            return;
          }


          const replaceExisting =
            window.confirm(
              "Replace current data with this backup?\n\nPress Cancel to merge it with your current data."
            );


          if (replaceExisting) {

            /*
              Reverse because the newest item
              should remain at the top.
            */

            passwords =
              [...uniqueImported];

          } else {

            /*
              Merge without exact duplicates.
              Imported entries are added to the top.
            */

            const existingTexts =
              new Set(
                passwords.map(
                  item => item.text
                )
              );


            const newItems =
              uniqueImported.filter(
                item =>
                  !existingTexts.has(item.text)
              );


            passwords =
              [
                ...newItems,
                ...passwords
              ];


            if (newItems.length === 0) {

              showToast(
                "No new attempts were found in the backup.",
                "info"
              );

              return;
            }
          }


          savePasswords();

          render();


          showToast(
            "Backup imported successfully.",
            "success"
          );

        } catch (error) {

          console.error(
            "Import failed:",
            error
          );

          showToast(
            "Invalid or corrupted backup file.",
            "error"
          );
        }
      };


      reader.onerror = function() {

        showToast(
          "Could not read the backup file.",
          "error"
        );
      };


      reader.readAsText(file);
    }


    /* =========================================================
       EVENT LISTENERS
    ========================================================= */

    addButton.addEventListener(
      "click",
      addPassword
    );


    /*
      Enter = Add password.
    */

    passwordInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          event.preventDefault();

          addPassword();
        }
      }
    );


    /*
      Search.
    */

    searchInput.addEventListener(
      "input",
      event => {

        setSearch(
          event.target.value
        );
      }
    );


    /*
      Filters.
    */

    document
      .querySelectorAll(".filter-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            setFilter(
              button.dataset.filter
            );
          }
        );

      });


    /*
      Export.
    */

    exportButton.addEventListener(
      "click",
      exportBackup
    );


    /*
      Import.
    */

    importButton.addEventListener(
      "click",
      importBackup
    );


    importFile.addEventListener(
      "change",
      event => {

        const file =
          event.target.files &&
          event.target.files[0];

        processImport(file);
      }
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    loadPasswords();

    updateFilterButtons();

    render();

  </script>
